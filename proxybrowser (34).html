<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProxyBrowser</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:   #09090f;
  --s1:   #0f0f1a;
  --s2:   #141422;
  --s3:   #1a1a2e;
  --s4:   #21213a;
  --b1:   rgba(255,255,255,0.05);
  --b2:   rgba(255,255,255,0.09);
  --b3:   rgba(255,255,255,0.14);
  --acc:  #5b8af7;
  --acc2: #7c5bf7;
  --grn:  #34d399;
  --red:  #f87171;
  --yel:  #fbbf24;
  --t1:   #f0f0ff;
  --t2:   #8888bb;
  --t3:   #55558a;
  --t4:   #33335a;
  --mono: 'JetBrains Mono', monospace;
  --disp: 'Syne', sans-serif;
  --r:    6px;
  --hdr:  44px;
  --tbh:  36px;
  --stb:  22px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--t1);font-family:var(--mono);font-size:13px}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit;line-height:1}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;border:none;outline:none}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--b3);border-radius:2px}
::-webkit-scrollbar-track{background:transparent}

/* ── APP SHELL ─────────────────────────── */
#app{display:flex;flex-direction:column;height:100vh}

/* ── TOOLBAR ───────────────────────────── */
#toolbar{
  display:flex;align-items:center;gap:5px;
  height:var(--hdr);padding:0 8px;
  background:var(--s1);border-bottom:1px solid var(--b1);
  flex-shrink:0;
}
.logo{
  font-family:var(--disp);font-size:17px;font-weight:800;letter-spacing:-.5px;
  background:linear-gradient(130deg,var(--acc),var(--acc2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  padding:0 6px 0 2px;flex-shrink:0;
}
.nb{
  width:28px;height:28px;border-radius:var(--r);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:var(--t3);transition:color .12s,background .12s;
}
.nb:hover:not(:disabled){color:var(--t1);background:var(--b2)}
.nb:disabled{opacity:.25;cursor:default}
.nb svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#url-wrap{
  flex:1;min-width:0;display:flex;align-items:center;gap:5px;
  background:var(--s3);border:1px solid var(--b2);border-radius:var(--r);
  height:28px;padding:0 8px;transition:border-color .15s;
}
#url-wrap:focus-within{border-color:rgba(91,138,247,.6)}
#url-lock{font-size:10px;flex-shrink:0;user-select:none;color:var(--grn)}
#url-scheme{font-size:11px;color:var(--t3);flex-shrink:0;user-select:none}
#url-input{flex:1;min-width:0;background:transparent;caret-color:var(--acc)}
#url-input::placeholder{color:var(--t4)}

.tbtn{
  height:28px;padding:0 10px;border-radius:var(--r);flex-shrink:0;
  background:var(--s3);border:1px solid var(--b2);color:var(--t2);
  font-size:11px;transition:all .12s;white-space:nowrap;
}
.tbtn:hover{background:var(--s4);color:var(--t1)}
.tbtn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff}
.tbtn.pri:hover{opacity:.88}
#proxy-tag{
  font-size:9px;font-weight:600;padding:3px 7px;border-radius:3px;flex-shrink:0;
  background:rgba(91,138,247,.12);border:1px solid rgba(91,138,247,.25);color:var(--acc);
  letter-spacing:.5px;
}

/* ── TABS ───────────────────────────────── */
#tabs-bar{
  height:var(--tbh);display:flex;align-items:center;
  background:var(--s2);border-bottom:1px solid var(--b1);
  flex-shrink:0;overflow:hidden;
}
#tabs-list{display:flex;gap:2px;padding:4px 6px;overflow-x:auto;overflow-y:hidden;flex:1;min-width:0}
#tabs-list::-webkit-scrollbar{height:0}
.tab{
  display:flex;align-items:center;gap:5px;
  padding:0 8px 0 10px;height:28px;border-radius:var(--r);
  background:var(--s3);border:1px solid transparent;
  cursor:pointer;flex-shrink:0;max-width:200px;min-width:60px;
  position:relative;transition:background .1s;user-select:none;
}
.tab:hover{background:var(--s4)}
.tab.active{background:var(--s4);border-color:var(--b2)}
.tab.active::after{content:'';position:absolute;bottom:-1px;left:8px;right:8px;height:1.5px;background:var(--acc);border-radius:1px}
.tab-ico{font-size:10px;flex-shrink:0}
.tab-lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:var(--t2)}
.tab.active .tab-lbl{color:var(--t1)}
.tab-x{
  width:14px;height:14px;flex-shrink:0;border-radius:3px;
  display:flex;align-items:center;justify-content:center;
  color:var(--t4);font-size:13px;transition:color .1s,background .1s;
}
.tab-x:hover{color:var(--t1);background:var(--b3)}
#new-tab{
  width:28px;height:28px;border-radius:var(--r);flex-shrink:0;margin:4px;
  display:flex;align-items:center;justify-content:center;
  color:var(--t3);font-size:20px;transition:color .12s,background .12s;
}
#new-tab:hover{color:var(--t1);background:var(--b2)}

/* ── VIEWPORT ───────────────────────────── */
#viewport{flex:1;position:relative;overflow:hidden}

.pane{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.pane.on{display:flex}

/* Loading overlay inside pane */
.p-load{
  position:absolute;inset:0;z-index:10;
  background:rgba(9,9,15,.92);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  transition:opacity .25s;
}
.p-load.off{opacity:0;pointer-events:none}
.spin{
  width:32px;height:32px;border-radius:50%;
  border:2px solid var(--b2);border-top-color:var(--acc);
  animation:spin .65s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.load-lbl{font-size:10px;color:var(--t3);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono)}

/* Frame */
.p-frame{flex:1;width:100%;border:none;display:block;background:#fff}

/* Content (non-frame: JSON, text, errors) */
.p-content{flex:1;overflow:auto;background:var(--bg)}

/* ── HOME ───────────────────────────────── */
.home{
  flex:1;overflow-y:auto;padding:48px 20px;
  background:var(--bg);display:flex;flex-direction:column;align-items:center;gap:40px;
}
.home-h{text-align:center}
.home-logo{
  font-family:var(--disp);font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1;
  background:linear-gradient(135deg,var(--acc),var(--acc2) 50%,#c084fc);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;
}
.home-sub{font-size:11px;color:var(--t3);letter-spacing:2px;font-family:var(--mono)}
.ql-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;width:100%;max-width:720px}
.ql{
  padding:12px 14px;border-radius:var(--r);
  background:var(--s1);border:1px solid var(--b1);
  cursor:pointer;text-align:left;transition:all .15s;
}
.ql:hover{background:var(--s2);border-color:var(--b3);transform:translateY(-1px)}
.ql-i{font-size:16px;margin-bottom:5px}
.ql-n{font-size:11px;color:var(--t1);font-family:var(--disp);font-weight:600}
.ql-u{font-size:10px;color:var(--t3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-wrap{width:100%;max-width:720px}
.hist-h{font-size:10px;color:var(--t3);letter-spacing:2px;margin-bottom:8px;font-family:var(--disp)}
.hi{
  display:flex;align-items:center;gap:8px;padding:7px 10px;
  border-radius:var(--r);cursor:pointer;border:1px solid transparent;transition:all .1s;
}
.hi:hover{background:var(--s1);border-color:var(--b1)}
.hi-url{flex:1;font-size:11px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hi-t{font-size:10px;color:var(--t4);flex-shrink:0}

/* ── JSON/TEXT/ERROR VIEWS ──────────────── */
.code-view{
  padding:16px;background:var(--bg);
  font-size:12px;line-height:1.7;
  white-space:pre-wrap;word-break:break-all;color:var(--t2);
}
.json-key{color:#5b8af7}.json-str{color:#34d399}.json-num{color:#fbbf24}
.json-bool{color:#c084fc}.json-null{color:#f87171}

.err-view{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;gap:14px;padding:40px;text-align:center;
}
.err-ico{font-size:36px}
.err-msg{color:var(--red);font-size:13px;font-weight:600}
.err-det{color:var(--t3);font-size:11px;max-width:480px;line-height:1.6}
.err-url{color:var(--t4);font-size:10px;word-break:break-all;max-width:480px}

/* ── STATUS BAR ─────────────────────────── */
#sbar{
  height:var(--stb);display:flex;align-items:center;gap:10px;padding:0 8px;
  background:var(--s1);border-top:1px solid var(--b1);flex-shrink:0;font-size:10px;color:var(--t3);
}
#sbar-txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp{
  padding:1px 6px;border-radius:3px;font-size:9px;font-weight:600;
  background:var(--b1);border:1px solid var(--b2);white-space:nowrap;
}
.sp.g{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.25);color:var(--grn)}
.sp.b{background:rgba(91,138,247,.12);border-color:rgba(91,138,247,.25);color:var(--acc)}
.sp.r{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.25);color:var(--red)}
.sp.y{background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.25);color:var(--yel)}

/* ── FORM MODAL ─────────────────────────── */
#fmodal{
  position:fixed;inset:0;z-index:900;
  background:rgba(0,0,0,.75);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;
}
#fmodal.off{display:none}
.fm{
  background:var(--s2);border:1px solid var(--b3);border-radius:10px;
  padding:22px;width:500px;max-width:92vw;max-height:82vh;
  display:flex;flex-direction:column;gap:14px;
  box-shadow:0 24px 64px rgba(0,0,0,.6);
}
.fm-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.fm-title{font-family:var(--disp);font-size:15px;font-weight:700}
.fm-x{color:var(--t3);font-size:18px;transition:color .12s;line-height:1}
.fm-x:hover{color:var(--t1)}
.fm-meta{font-size:10px;color:var(--t3);font-family:var(--mono);word-break:break-all;line-height:1.5}
.fm-badge{display:inline-block;padding:2px 7px;border-radius:3px;font-size:9px;font-weight:700;margin-right:5px;letter-spacing:.5px}
.badge-post{background:rgba(248,113,113,.15);border:1px solid rgba(248,113,113,.3);color:var(--red)}
.badge-get{background:rgba(52,211,153,.15);border:1px solid rgba(52,211,153,.3);color:var(--grn)}
.fm-fields{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:2px}
.fm-row{display:flex;flex-direction:column;gap:4px}
.fm-lbl{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.8px}
.fm-ctrl{
  padding:7px 10px;border-radius:var(--r);
  background:var(--s3);border:1px solid var(--b2);
  color:var(--t1);font-size:12px;font-family:var(--mono);
  transition:border-color .12s;width:100%;
}
.fm-ctrl:focus{border-color:rgba(91,138,247,.5);outline:none}
.fm-ctrl select option{background:var(--s2)}
.fm-foot{display:flex;gap:8px;justify-content:flex-end}
.fm-cancel{padding:7px 14px;border-radius:var(--r);background:var(--s3);border:1px solid var(--b2);color:var(--t2);transition:all .12s}
.fm-cancel:hover{color:var(--t1)}
.fm-go{padding:7px 16px;border-radius:var(--r);background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:600;transition:opacity .12s}
.fm-go:hover{opacity:.85}

/* ── TOAST ──────────────────────────────── */
#toast{
  position:fixed;bottom:28px;left:50%;
  transform:translateX(-50%) translateY(8px);
  background:var(--s3);border:1px solid var(--b3);border-radius:var(--r);
  padding:7px 14px;font-size:12px;color:var(--t1);z-index:9999;
  opacity:0;transition:all .22s;pointer-events:none;white-space:nowrap;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">

  <!-- TOOLBAR -->
  <div id="toolbar">
    <span class="logo">PX</span>

    <button class="nb" id="btn-back" title="Back (Alt+←)" disabled>
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button class="nb" id="btn-fwd" title="Forward (Alt+→)" disabled>
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <button class="nb" id="btn-reload" title="Reload (Ctrl+R)">
      <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    </button>
    <button class="nb" id="btn-home" title="Home">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </button>

    <div id="url-wrap">
      <span id="url-lock">🔒</span>
      <span id="url-scheme">https://</span>
      <input id="url-input" placeholder="Search DuckDuckGo or enter URL…" spellcheck="false" autocomplete="off"/>
    </div>

    <button class="tbtn pri" id="btn-go">Go</button>
    <button class="tbtn" id="btn-src" title="View source">‹/›</button>
    <div id="proxy-tag">KILLCORS</div>
  </div>

  <!-- TABS BAR -->
  <div id="tabs-bar">
    <div id="tabs-list"></div>
    <button id="new-tab" title="New tab (Ctrl+T)">+</button>
  </div>

  <!-- VIEWPORT -->
  <div id="viewport"></div>

  <!-- STATUS BAR -->
  <div id="sbar">
    <span id="sbar-txt">Ready</span>
    <span class="sp b" id="sp-proxy">killcors</span>
    <span class="sp" id="sp-ct">—</span>
    <span class="sp g" id="sp-size">—</span>
    <span class="sp b" id="sp-ms">—</span>
  </div>

</div><!-- #app -->

<!-- FORM MODAL -->
<div id="fmodal" class="off">
  <div class="fm">
    <div class="fm-hd">
      <div class="fm-title">Submit Form</div>
      <button class="fm-x" id="fm-x">✕</button>
    </div>
    <div class="fm-meta" id="fm-meta"></div>
    <div class="fm-fields" id="fm-fields"></div>
    <div class="fm-foot">
      <button class="fm-cancel" id="fm-cancel">Cancel</button>
      <button class="fm-go" id="fm-go">Submit →</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
'use strict';

/* ══════════════════════════════════════════
   UTILS
══════════════════════════════════════════ */
const $  = id => document.getElementById(id);
const $$ = (sel, ctx = document) => Array.from(ctx.querySelectorAll(sel));

let _toastTimer;
function toast(msg, dur = 2600) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('on'), dur);
}

function setStatus(msg) { $('sbar-txt').textContent = msg; }

function setPill(id, text, cls = '') {
  const el = $(id);
  if (!el) return;
  el.textContent = text;
  el.className = 'sp' + (cls ? ' ' + cls : '');
}

const fmtSz = b => !b ? '—' : b < 1024 ? b + 'B' : b < 1048576 ? (b/1024).toFixed(1) + 'KB' : (b/1048576).toFixed(2) + 'MB';
const fmtMs = ms => ms < 1000 ? ms + 'ms' : (ms/1000).toFixed(2) + 's';
const relT  = ts => { const d=Date.now()-ts; return d<60000?'now':d<3.6e6?~~(d/60000)+'m':d<86400000?~~(d/3.6e6)+'h':~~(d/86400000)+'d'; };

/* ══════════════════════════════════════════
   PROXY — killcors.com primary, allorigins fallback
══════════════════════════════════════════ */
const Proxy = {
  KC:  url => `https://proxy.killcors.com?url=${encodeURIComponent(url)}`,
  AO:  url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,

  resolve(href, base) {
    if (!href || href.startsWith('javascript:') || href.startsWith('data:')) return null;
    try { return new URL(href, base).href; } catch { return null; }
  },

  async get(url) {
    const t0 = Date.now();
    // 1st: killcors
    try {
      const r  = await fetch(this.KC(url), { cache: 'no-store' });
      const ct = r.headers.get('content-type') || '';
      const body = await r.text();
      return { body, ct, ok: r.ok, code: r.status, ms: Date.now()-t0, via: 'killcors' };
    } catch(e1) {
      // 2nd: allorigins
      try {
        const r2   = await fetch(this.AO(url), { cache: 'no-store' });
        const json = await r2.json();
        return {
          body: json.contents || '',
          ct:   json.status?.content_type || '',
          ok:   (json.status?.http_code || 0) < 400,
          code: json.status?.http_code || 0,
          ms:   Date.now()-t0,
          via:  'allorigins',
        };
      } catch(e2) {
        throw new Error('Both proxies failed — ' + e1.message);
      }
    }
  },

  // POST via killcors (it supports forwarding POST bodies)
  async post(url, data, enctype = 'application/x-www-form-urlencoded') {
    const t0 = Date.now();
    let body, headers = {};
    if (enctype === 'multipart/form-data') {
      body = new FormData();
      for (const [k, v] of Object.entries(data)) body.append(k, v);
    } else {
      body = new URLSearchParams(data).toString();
      headers['Content-Type'] = 'application/x-www-form-urlencoded';
    }
    const r  = await fetch(this.KC(url), { method: 'POST', headers, body, cache: 'no-store' });
    const ct = r.headers.get('content-type') || '';
    const text = await r.text();
    return { body: text, ct, ok: r.ok, code: r.status, ms: Date.now()-t0, via: 'killcors-POST' };
  },
};

/* ══════════════════════════════════════════
   HISTORY
══════════════════════════════════════════ */
const Hist = {
  _k: 'px3_hist',
  items: [],
  load() { try { this.items = JSON.parse(localStorage.getItem(this._k)) || []; } catch { this.items = []; } },
  save() { localStorage.setItem(this._k, JSON.stringify(this.items.slice(0, 80))); },
  add(url) {
    this.items = this.items.filter(i => i.url !== url);
    this.items.unshift({ url, ts: Date.now() });
    this.save();
  },
};
Hist.load();

/* ══════════════════════════════════════════
   FORM MODAL
══════════════════════════════════════════ */
const FormModal = {
  _res: null,

  show(fields, action, method, enctype, baseUrl) {
    return new Promise(resolve => {
      this._res = resolve;
      const isPost = method.toUpperCase() === 'POST';
      $('fm-meta').innerHTML =
        `<span class="fm-badge ${isPost ? 'badge-post' : 'badge-get'}">${method.toUpperCase()}</span>${action}`;

      const container = $('fm-fields');
      container.innerHTML = '';
      this._rows = [];

      fields.forEach(f => {
        if (f.hidden) return; // handled via _hidden below
        const row = document.createElement('div');
        row.className = 'fm-row';
        const lbl = document.createElement('label');
        lbl.className = 'fm-lbl';
        lbl.textContent = f.label || f.name || f.type;

        let ctrl;
        if (f.type === 'select') {
          ctrl = document.createElement('select');
          ctrl.className = 'fm-ctrl';
          (f.options || []).forEach(o => {
            const opt = document.createElement('option');
            opt.value = o.value; opt.textContent = o.text;
            if (o.selected) opt.selected = true;
            ctrl.appendChild(opt);
          });
        } else if (f.type === 'textarea') {
          ctrl = document.createElement('textarea');
          ctrl.className = 'fm-ctrl';
          ctrl.rows = 3; ctrl.value = f.value || '';
        } else {
          ctrl = document.createElement('input');
          ctrl.className = 'fm-ctrl';
          ctrl.type = f.type === 'password' ? 'password' : f.type === 'email' ? 'email' : f.type === 'number' ? 'number' : 'text';
          ctrl.value = f.value || '';
          ctrl.placeholder = f.placeholder || '';
        }

        row.appendChild(lbl);
        row.appendChild(ctrl);
        container.appendChild(row);
        this._rows.push({ name: f.name, ctrl, type: f.type });
      });

      this._hidden = fields.filter(f => f.hidden);
      this._action = action;
      this._method = method;
      this._enctype = enctype;

      $('fmodal').classList.remove('off');

      // Submit on Enter in single-line inputs
      container.querySelectorAll('input').forEach(inp => {
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') this.submit(); });
      });
    });
  },

  cancel() { $('fmodal').classList.add('off'); if (this._res) { this._res(null); this._res = null; } },

  submit() {
    $('fmodal').classList.add('off');
    if (!this._res) return;
    const data = {};
    this._hidden.forEach(f => { if (f.name) data[f.name] = f.value; });
    this._rows.forEach(r => { if (r.name) data[r.name] = r.ctrl.value; });
    this._res({ data, action: this._action, method: this._method, enctype: this._enctype });
    this._res = null;
  },
};

/* ══════════════════════════════════════════
   RENDERER
══════════════════════════════════════════ */
const Renderer = {

  rewriteDoc(doc, baseUrl) {
    // Images → killcors (so they load cross-origin)
    $$('img[src]', doc).forEach(el => {
      const abs = Proxy.resolve(el.getAttribute('src'), baseUrl);
      if (abs) el.src = Proxy.KC(abs);
    });
    $$('img[srcset]', doc).forEach(el => el.removeAttribute('srcset'));
    $$('picture source', doc).forEach(el => el.removeAttribute('srcset'));

    // Video/audio posters
    $$('video[poster]', doc).forEach(el => {
      const abs = Proxy.resolve(el.getAttribute('poster'), baseUrl);
      if (abs) el.setAttribute('poster', Proxy.KC(abs));
    });

    // Stylesheets → killcors
    $$('link[rel~="stylesheet"][href]', doc).forEach(el => {
      const abs = Proxy.resolve(el.getAttribute('href'), baseUrl);
      if (abs) el.href = Proxy.KC(abs);
    });

    // Inline style url() → killcors
    $$('[style]', doc).forEach(el => {
      const s = el.getAttribute('style');
      if (s && s.includes('url(')) {
        el.setAttribute('style', s.replace(/url\(\s*['"]?([^'")\s]+)['"]?\s*\)/g, (_, u) => {
          const abs = Proxy.resolve(u, baseUrl);
          return `url(${abs ? Proxy.KC(abs) : u})`;
        }));
      }
    });

    // Scripts → remove (can't execute cross-origin JS safely)
    $$('script', doc).forEach(el => el.remove());

    // Favicons — leave as-is (browsers handle internally)

    // Links → intercept
    $$('a[href]', doc).forEach(el => {
      const href = el.getAttribute('href');
      if (!href || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('tel:')) return;
      const abs = Proxy.resolve(href, baseUrl);
      if (abs) { el.setAttribute('data-proxyon', abs); el.setAttribute('href', '#'); el.title = abs; }
    });

    // Forms → intercept
    $$('form', doc).forEach((form, i) => {
      form.setAttribute('data-proxyform', String(i));
      form.setAttribute('data-base', baseUrl);
    });

    return doc;
  },

  writeFrame(frame, doc, baseUrl) {
    const head = doc.head?.innerHTML ?? '';
    const body = doc.body?.innerHTML ?? doc.documentElement.innerHTML;

    const html = `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<base href="${baseUrl}">
${head}
<style>
* { box-sizing: border-box; }
:root { color-scheme: light; }
img { max-width: 100%; }
</style>
</head>
<body>
${body}
<script>
(function(){
  // ── Intercept link clicks ────────────────────────────────
  document.addEventListener('click', function(e) {
    // Button/submit inside proxied form
    const submitBtn = e.target.closest('button[type="submit"],input[type="submit"],button:not([type])');
    if (submitBtn) {
      const form = submitBtn.closest('form[data-proxyform]');
      if (form) { e.preventDefault(); form.dispatchEvent(new Event('submit', {bubbles:true,cancelable:true})); return; }
    }
    // data-proxyon link
    const a = e.target.closest('[data-proxyon]');
    if (a) {
      e.preventDefault();
      window.parent.postMessage({ type:'px-nav', url: a.dataset.proxyon }, '*');
    }
  }, true);

  // ── Intercept form submit ────────────────────────────────
  document.addEventListener('submit', function(e) {
    const form = e.target;
    if (!form.hasAttribute('data-proxyform')) return;
    e.preventDefault();

    const fd = new FormData(form);
    const data = {};
    for (const [k,v] of fd.entries()) data[k] = v;

    // Also grab unchecked checkboxes (FormData omits them)
    form.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      if (!cb.checked && cb.name && !(cb.name in data)) data[cb.name] = '';
    });

    const action  = form.action  || form.getAttribute('data-base') || '';
    const method  = form.method  || 'get';
    const enctype = form.enctype || 'application/x-www-form-urlencoded';

    window.parent.postMessage({ type:'px-form', action, method, enctype, data }, '*');
  }, true);

  // ── Rewrite dynamically injected images ─────────────────
  const KC = url => 'https://proxy.killcors.com?url=' + encodeURIComponent(url);
  const obs = new MutationObserver(muts => {
    muts.forEach(m => m.addedNodes.forEach(n => {
      if (n.nodeType !== 1) return;
      const imgs = n.tagName === 'IMG' ? [n] : Array.from(n.querySelectorAll('img[src]'));
      imgs.forEach(img => {
        const src = img.getAttribute('src');
        if (src && !src.startsWith('data:') && !src.includes('proxy.killcors.com')) {
          try { img.src = KC(new URL(src, document.baseURI).href); } catch {}
        }
      });
    }));
  });
  obs.observe(document.body, { childList: true, subtree: true });
})();
<\/script>
</body>
</html>`;

    const fdoc = frame.contentDocument;
    fdoc.open();
    fdoc.write(html);
    fdoc.close();
  },

  renderHTML(body, url, pane) {
    const parser = new DOMParser();
    const doc    = parser.parseFromString(body, 'text/html');
    this.rewriteDoc(doc, url);

    // Get or create frame
    let frame = pane.querySelector('.p-frame');
    if (!frame) {
      // Clear any previous content view
      const prev = pane.querySelector('.p-content');
      if (prev) prev.remove();
      frame = document.createElement('iframe');
      frame.className = 'p-frame';
      frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-presentation');
      frame.style.cssText = 'flex:1;width:100%;border:none;display:block;background:#fff';
      pane.appendChild(frame);
    }

    this.writeFrame(frame, doc, url);

    // Attach message listener for this frame's events
    this._listenFrame(frame, url, pane);

    const title = doc.title?.trim() || url.split('/').filter(Boolean).pop() || 'Page';
    return { title: title.slice(0, 50), favicon: '🌐' };
  },

  _listeners: new WeakMap(),
  _listenFrame(frame, baseUrl, pane) {
    // Remove old listener if any
    const old = this._listeners.get(frame);
    if (old) window.removeEventListener('message', old);

    const handler = async (e) => {
      // Make sure it's from this frame
      if (!frame.isConnected) { window.removeEventListener('message', handler); return; }
      if (e.source !== frame.contentWindow) return;
      const msg = e.data;
      if (!msg?.type) return;

      if (msg.type === 'px-nav') {
        Browser.go(msg.url);
      } else if (msg.type === 'px-form') {
        await FormHandler.handle(msg, baseUrl);
      }
    };

    this._listeners.set(frame, handler);
    window.addEventListener('message', handler);
  },

  renderJSON(body, pane) {
    this._setContent(pane);
    const c = pane.querySelector('.p-content');
    c.style.background = '#09090f';
    try {
      const parsed  = JSON.parse(body);
      const pretty  = JSON.stringify(parsed, null, 2);
      const colored = pretty
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"([^"]+)":/g, '<span class="json-key">"$1"</span>:')
        .replace(/:\s*"([^"]*)"/g, ': <span class="json-str">"$1"</span>')
        .replace(/:\s*(\d+\.?\d*)/g, ': <span class="json-num">$1</span>')
        .replace(/:\s*(true|false)/g, ': <span class="json-bool">$1</span>')
        .replace(/:\s*(null)/g, ': <span class="json-null">null</span>');
      c.innerHTML = `<pre class="code-view" style="color:var(--t2)">${colored}</pre>`;
    } catch {
      c.innerHTML = `<pre class="code-view">${body.replace(/</g,'&lt;')}</pre>`;
    }
  },

  renderText(body, pane) {
    this._setContent(pane);
    const c = pane.querySelector('.p-content');
    c.style.background = '#09090f';
    c.innerHTML = `<pre class="code-view">${body.replace(/</g,'&lt;')}</pre>`;
  },

  renderSource(body, pane) {
    this._setContent(pane);
    const c = pane.querySelector('.p-content');
    c.style.background = '#09090f';
    c.innerHTML = `<pre class="code-view" style="color:#94a3b8">${body.replace(/</g,'&lt;')}</pre>`;
  },

  renderError(msg, url, pane) {
    this._setContent(pane);
    const c = pane.querySelector('.p-content');
    c.style.background = '#09090f';
    c.innerHTML = `
      <div class="err-view">
        <div class="err-ico">⚠</div>
        <div class="err-msg">Failed to load</div>
        <div class="err-det">${msg.replace(/</g,'&lt;')}</div>
        <div class="err-url">${url.replace(/</g,'&lt;')}</div>
      </div>`;
  },

  _setContent(pane) {
    // Remove iframe if present, add/keep .p-content
    const frame = pane.querySelector('.p-frame');
    if (frame) frame.remove();
    let c = pane.querySelector('.p-content');
    if (!c) {
      c = document.createElement('div');
      c.className = 'p-content';
      c.style.cssText = 'flex:1;overflow:auto';
      pane.appendChild(c);
    }
    return c;
  },
};

/* ══════════════════════════════════════════
   FORM HANDLER
══════════════════════════════════════════ */
const FormHandler = {
  async handle(msg, baseUrl) {
    const action  = msg.action  || baseUrl;
    const method  = (msg.method || 'get').toUpperCase();
    const enctype = msg.enctype || 'application/x-www-form-urlencoded';
    const rawData = msg.data || {};

    // Resolve action URL
    const dest = Proxy.resolve(action, baseUrl) || baseUrl;

    if (method === 'GET') {
      // Append as query string and navigate
      const qs = new URLSearchParams(rawData).toString();
      Browser.go(dest + (dest.includes('?') ? '&' : '?') + qs);
      return;
    }

    // POST — build field list and show modal
    const fields = Object.entries(rawData).map(([k, v]) => ({
      name: k, label: k, type: 'text', value: v, hidden: false,
    }));

    setStatus('Form intercepted — review and submit…');
    const result = await FormModal.show(fields, dest, method, enctype, dest);

    if (!result) { setStatus('Form cancelled'); return; }

    setStatus(`POST → ${result.action}…`);
    try {
      const res = await Proxy.post(result.action, result.data, result.enctype);
      setPill('sp-ct', res.ct.split(';')[0] || '—', '');
      setPill('sp-size', fmtSz(res.body.length), 'g');
      setPill('sp-ms', fmtMs(res.ms), 'b');
      setPill('sp-proxy', res.via, 'b');
      Browser.renderResponse(res, result.action);
    } catch(e) {
      toast('POST failed: ' + e.message);
      setStatus('Error: ' + e.message);
    }
  },
};

/* ══════════════════════════════════════════
   TABS
══════════════════════════════════════════ */
const Tabs = {
  _list: [], _cur: null, _uid: 0,

  init() { this.create(); },

  create(url = '') {
    const id  = ++this._uid;
    const tab = { id, url:'', title:'New Tab', favicon:'🏠', hist:[], hIdx:-1, lastBody:'', lastUrl:'', srcMode:false };
    this._list.push(tab);

    // Create pane DOM
    const pane = document.createElement('div');
    pane.className = 'pane';
    pane.id = 'pane-' + id;
    pane.innerHTML = `
      <div class="p-load off" id="pl-${id}">
        <div class="spin"></div>
        <div class="load-lbl" id="pll-${id}"></div>
      </div>`;
    $('viewport').appendChild(pane);

    this._render();
    this.activate(id);
    if (url) Browser.go(url);
    return tab;
  },

  close(id) {
    if (this._list.length === 1) { this.create(); }
    const i = this._list.findIndex(t => t.id === id);
    if (i < 0) return;
    this._list.splice(i, 1);
    const pane = $('pane-' + id);
    if (pane) pane.remove();
    if (this._cur === id) {
      const next = this._list[Math.min(i, this._list.length - 1)];
      this.activate(next.id);
    } else {
      this._render();
    }
  },

  activate(id) {
    this._cur = id;
    this._render();
    document.querySelectorAll('.pane').forEach(p => p.classList.remove('on'));
    const pane = $('pane-' + id);
    if (pane) pane.classList.add('on');
    const tab = this.cur();
    if (tab) { $('url-input').value = tab.url || ''; this._updNav(); }
  },

  cur() { return this._list.find(t => t.id === this._cur) || null; },

  pane(id = this._cur) { return $('pane-' + id); },

  setInfo(id, title, favicon = '🌐') {
    const t = this._list.find(x => x.id === id);
    if (!t) return;
    t.title = title; t.favicon = favicon;
    this._render();
  },

  showLoad(id, url) {
    const lo = $('pl-' + id), ll = $('pll-' + id);
    if (lo) lo.classList.remove('off');
    if (ll) ll.textContent = url;
  },

  hideLoad(id) { const lo = $('pl-' + id); if (lo) lo.classList.add('off'); },

  pushHist(id, url) {
    const t = this._list.find(x => x.id === id);
    if (!t) return;
    t.hist = t.hist.slice(0, t.hIdx + 1);
    t.hist.push(url); t.hIdx = t.hist.length - 1;
    t.url = url;
    this._updNav();
    Hist.add(url);
    $('url-input').value = url;
    $('url-lock').textContent   = url.startsWith('https') ? '🔒' : '⚠';
    $('url-scheme').textContent = url.match(/^[a-z]+:\/\//i)?.[0] || 'https://';
  },

  _updNav() {
    const t = this.cur();
    $('btn-back').disabled = !t || t.hIdx < 1;
    $('btn-fwd').disabled  = !t || t.hIdx >= t.hist.length - 1;
  },

  _render() {
    const list = $('tabs-list');
    list.innerHTML = '';
    this._list.forEach(t => {
      const el = document.createElement('div');
      el.className = 'tab' + (t.id === this._cur ? ' active' : '');
      el.innerHTML = `<span class="tab-ico">${t.favicon}</span><span class="tab-lbl">${t.title}</span><span class="tab-x" data-id="${t.id}">×</span>`;
      el.addEventListener('click', e => {
        if (e.target.classList.contains('tab-x')) return;
        this.activate(t.id);
      });
      el.querySelector('.tab-x').addEventListener('click', e => {
        e.stopPropagation(); this.close(t.id);
      });
      list.appendChild(el);
    });
  },
};

/* ══════════════════════════════════════════
   BROWSER ENGINE
══════════════════════════════════════════ */
const Browser = {

  async go(rawUrl, push = true) {
    if (!rawUrl) { this.home(); return; }

    // Normalize
    let url = rawUrl.trim();
    if (!url || url === 'about:newtab') { this.home(); return; }

    // If it doesn't look like a URL, search DuckDuckGo
    if (!/^https?:\/\//i.test(url)) {
      if (url.includes(' ') || !url.includes('.')) {
        url = 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(url);
      } else {
        url = 'https://' + url;
      }
    }

    const tabId = Tabs._cur;
    const tab   = Tabs.cur();
    if (!tab) return;

    tab.srcMode = false;
    $('btn-src').style.color = '';

    if (push) Tabs.pushHist(tabId, url);

    Tabs.showLoad(tabId, url);
    setStatus('Loading…');
    setPill('sp-ct', '—'); setPill('sp-size', '—'); setPill('sp-ms', '—');

    try {
      const res = await Proxy.get(url);
      Tabs.hideLoad(tabId);

      tab.lastBody = res.body;
      tab.lastUrl  = url;

      setPill('sp-ct',    res.ct.split(';')[0].trim() || '—', '');
      setPill('sp-size',  fmtSz(res.body?.length), 'g');
      setPill('sp-ms',    fmtMs(res.ms), 'b');
      setPill('sp-proxy', res.via, res.via === 'killcors' ? 'g' : 'y');

      this.renderResponse(res, url, tabId);

    } catch(e) {
      Tabs.hideLoad(tabId);
      setStatus('Error: ' + e.message);
      Renderer.renderError(e.message, url, Tabs.pane(tabId));
    }
  },

  renderResponse(res, url, tabId = Tabs._cur) {
    const tab  = Tabs._list.find(t => t.id === tabId);
    const pane = Tabs.pane(tabId);
    if (!pane || !tab) return;

    const ct   = (res.ct || '').toLowerCase();
    const body = res.body || '';

    // Source mode override
    if (tab.srcMode) {
      Renderer.renderSource(body, pane);
      setStatus('Source: ' + url);
      return;
    }

    // JSON
    if (ct.includes('json') || body.trim().startsWith('{') || body.trim().startsWith('[')) {
      Renderer.renderJSON(body, pane);
      Tabs.setInfo(tabId, 'JSON Response', '{}');
      setStatus('JSON — ' + url);
      return;
    }

    // HTML
    if (ct.includes('html') || ct.includes('xhtml')
        || body.trim().toLowerCase().startsWith('<!doctype')
        || body.trim().toLowerCase().startsWith('<html')) {
      const info = Renderer.renderHTML(body, url, pane);
      Tabs.setInfo(tabId, info.title, info.favicon);
      setStatus('Loaded: ' + info.title);
      return;
    }

    // Plain text / everything else
    Renderer.renderText(body, pane);
    Tabs.setInfo(tabId, url.split('/').pop() || 'Text', '📄');
    setStatus('Text — ' + url);
  },

  back() {
    const tab = Tabs.cur();
    if (!tab || tab.hIdx < 1) return;
    tab.hIdx--;
    const url = tab.hist[tab.hIdx];
    tab.url = url; $('url-input').value = url;
    Tabs._updNav();
    this.go(url, false);
  },

  forward() {
    const tab = Tabs.cur();
    if (!tab || tab.hIdx >= tab.hist.length - 1) return;
    tab.hIdx++;
    const url = tab.hist[tab.hIdx];
    tab.url = url; $('url-input').value = url;
    Tabs._updNav();
    this.go(url, false);
  },

  reload() {
    const tab = Tabs.cur();
    if (tab?.url) this.go(tab.url, false);
  },

  viewSource() {
    const tab  = Tabs.cur();
    const pane = Tabs.pane();
    if (!tab?.lastBody) { toast('No page loaded'); return; }
    tab.srcMode = !tab.srcMode;
    if (tab.srcMode) {
      Renderer.renderSource(tab.lastBody, pane);
      $('btn-src').style.color = '#5b8af7';
      setStatus('Source view');
    } else {
      this.go(tab.lastUrl || tab.url, false);
      $('btn-src').style.color = '';
    }
  },

  home() {
    const tabId  = Tabs._cur;
    const tab    = Tabs.cur();
    const pane   = Tabs.pane();
    if (!pane) return;

    if (tab) { tab.url = ''; tab.srcMode = false; }
    $('url-input').value = '';
    $('url-lock').textContent   = '🔒';
    $('url-scheme').textContent = 'https://';

    // Remove frame, add home div
    const frame = pane.querySelector('.p-frame');
    if (frame) frame.remove();
    let c = pane.querySelector('.p-content');
    if (!c) { c = document.createElement('div'); c.className = 'p-content'; c.style.cssText = 'flex:1;overflow:auto'; pane.appendChild(c); }
    c.style.background = 'var(--bg)';
    c.innerHTML = this._homeHTML();

    Tabs.setInfo(tabId, 'New Tab', '🏠');
    setStatus('Ready');
  },

  _homeHTML() {
    const links = [
      { i:'🔍', n:'DuckDuckGo',   u:'https://html.duckduckgo.com/html/' },
      { i:'📖', n:'Wikipedia',    u:'https://en.wikipedia.org' },
      { i:'📰', n:'HackerNews',   u:'https://news.ycombinator.com' },
      { i:'💻', n:'GitHub',       u:'https://github.com' },
      { i:'📦', n:'NPM',          u:'https://npmjs.com' },
      { i:'🌐', n:'MDN Docs',     u:'https://developer.mozilla.org/en-US/docs/Web' },
      { i:'🔧', n:'HTTPBin',      u:'https://httpbin.org' },
      { i:'📡', n:'JSONPlaceholder', u:'https://jsonplaceholder.typicode.com' },
      { i:'📚', n:'Archive.org',  u:'https://archive.org' },
      { i:'🗺️', n:'OpenStreetMap', u:'https://www.openstreetmap.org' },
      { i:'🎓', n:'Khan Academy', u:'https://www.khanacademy.org' },
      { i:'🔬', n:'arXiv',        u:'https://arxiv.org' },
    ];
    const hist = Hist.items.slice(0, 12);
    return `
    <div class="home">
      <div class="home-h">
        <div class="home-logo">ProxyBrowser</div>
        <div class="home-sub">killcors.com · GET &amp; POST · Full Web Access</div>
      </div>
      <div class="ql-grid">
        ${links.map(l => `<div class="ql" onclick="Browser.go('${l.u}')">
          <div class="ql-i">${l.i}</div>
          <div class="ql-n">${l.n}</div>
          <div class="ql-u">${l.u.replace(/^https?:\/\//,'')}</div>
        </div>`).join('')}
      </div>
      ${hist.length ? `
      <div class="hist-wrap">
        <div class="hist-h">Recently Visited</div>
        ${hist.map(h => `<div class="hi" onclick="Browser.go('${h.url.replace(/'/g,'\\'')}')">
          <span style="color:var(--t3);font-size:11px">🕑</span>
          <span class="hi-url">${h.url}</span>
          <span class="hi-t">${relT(h.ts)} ago</span>
        </div>`).join('')}
      </div>` : ''}
    </div>`;
  },
};

/* ══════════════════════════════════════════
   INIT
══════════════════════════════════════════ */
function init() {
  Tabs.init();
  Browser.home();

  // URL bar
  const ui = $('url-input');
  ui.addEventListener('keydown', e => {
    if (e.key === 'Enter') { const v = ui.value.trim(); if (v) Browser.go(v); }
    if (e.key === 'Escape') { ui.blur(); }
  });
  ui.addEventListener('focus', () => ui.select());

  // Toolbar
  $('btn-go').addEventListener('click',     () => { const v = ui.value.trim(); if (v) Browser.go(v); });
  $('btn-back').addEventListener('click',   () => Browser.back());
  $('btn-fwd').addEventListener('click',    () => Browser.forward());
  $('btn-reload').addEventListener('click', () => Browser.reload());
  $('btn-home').addEventListener('click',   () => Browser.home());
  $('btn-src').addEventListener('click',    () => Browser.viewSource());
  $('new-tab').addEventListener('click',    () => Tabs.create());

  // Form modal
  $('fm-x').addEventListener('click',      () => FormModal.cancel());
  $('fm-cancel').addEventListener('click', () => FormModal.cancel());
  $('fm-go').addEventListener('click',     () => FormModal.submit());
  $('fmodal').addEventListener('click',    e => { if (e.target === $('fmodal')) FormModal.cancel(); });

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    const cmd = e.ctrlKey || e.metaKey;
    if (e.altKey && e.key === 'ArrowLeft')  { Browser.back();     e.preventDefault(); }
    if (e.altKey && e.key === 'ArrowRight') { Browser.forward();  e.preventDefault(); }
    if (cmd && e.key === 'r')               { Browser.reload();   e.preventDefault(); }
    if (cmd && e.key === 'l')               { ui.focus(); ui.select(); e.preventDefault(); }
    if (cmd && e.key === 't')               { Tabs.create();      e.preventDefault(); }
    if (cmd && e.key === 'w')               { Tabs.close(Tabs._cur); e.preventDefault(); }
    if (e.key === 'Escape')                 { FormModal.cancel(); }
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
