// FEATURE 1 — LISTEN HISTORY + PER-EPISODE RESUME POSITION
// ═══════════════════════════════════════════════════════════════
const History = {
  _items: [],   // [{ep, show, finishedAt, position, duration}]
  _resume: {},  // {trackId: seconds}
  MAX: 100,

  load() {
    try { this._items  = JSON.parse(localStorage.getItem(LS_HIST))   || []; } catch { this._items  = []; }
    try { this._resume = JSON.parse(localStorage.getItem(LS_RESUME)) || {}; } catch { this._resume = {}; }
  },

  savePosition(trackId, pos) {
    if (!trackId || pos < 5) return;
    this._resume[String(trackId)] = Math.floor(pos);
    localStorage.setItem(LS_RESUME, JSON.stringify(this._resume));
  },

  getPosition(trackId) {
    return this._resume[String(trackId)] || 0;
  },

  markPlayed(ep, show, pos, dur) {
    if (!ep?.trackId) return;
    // Remove old entry for same episode
    this._items = this._items.filter(i => i.ep?.trackId !== ep.trackId);
    this._items.unshift({ ep, show, pos: Math.floor(pos), dur: Math.floor(dur||0), ts: Date.now() });
    if (this._items.length > this.MAX) this._items = this._items.slice(0, this.MAX);
    localStorage.setItem(LS_HIST, JSON.stringify(this._items));
    renderHistList();
  },

  clear() {
    this._items = [];
    this._resume = {};
    localStorage.removeItem(LS_HIST);
    localStorage.removeItem(LS_RESUME);
    renderHistList();
  },
};

function renderHistList() {
  const el = $('histList');
  if (!el) return;
  if (!History._items.length) {
    el.innerHTML = '<div class="empty-favs">No listen history yet.</div>';
    return;
  }
  el.innerHTML = History._items.map((item, i) => {
    const title   = strip(item.ep?.trackName || 'Unknown Episode').substring(0, 50);
    const show    = strip(item.show?.collectionName || '').substring(0, 40);
    const art     = artImg(item.show?.artworkUrl100 || '', 60);
    const pct     = item.dur > 0 ? Math.min(100, Math.round(item.pos / item.dur * 100)) : 0;
    const timeStr = pct >= 95 ? '✓' : fmtTime(item.pos);
    return `<div class="hist-item" onclick="playFromHistory(${i})">
      <img class="hist-thumb" src="${esc(art)}" alt="" onerror="this.style.visibility='hidden'">
      <div class="hist-body">
        <div class="hist-ep">${esc(title)}</div>
        <div class="hist-show">${esc(show)} · ${timeStr}</div>
        <div class="hist-prog"><div class="hist-prog-fill" style="width:${pct}%"></div></div>
      </div>
    </div>`;
  }).join('');
}

window.playFromHistory = (i) => {
  const item = History._items[i];
  if (!item?.ep) return;
  const ep  = item.ep;
  const show = item.show;
  S.queue    = [{ep, show}];
  S.queueIdx = 0;
  playQueue(0);
  // Seek to saved position after load
  const pos = History.getPosition(ep.trackId);
  if (pos > 5) {
    const vel = $('videoEl');
    const trySeek = (el) => {
      const doSeek = () => { if (pos < (el.duration||0) - 3) el.currentTime = pos; };
      el.addEventListener('loadedmetadata', doSeek, {once:true});
      el.addEventListener('canplay', doSeek, {once:true});
    };
    if (isVideoEp(ep)) trySeek(vel); else trySeek(audio);
  }
  switchSideTab('hist', document.querySelector('.sidebar-tab:nth-child(2)'));
  toast('\u25b6 Resuming: ' + strip(ep.trackName||'').substring(0,36));
};

function switchSideTab(name, btn) {
  document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.sidebar-pane').forEach(p => p.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const pane = $('pane-' + name);
  if (pane) pane.classList.add('active');
}

// ═══════════════════════════════════════════════════════════════
// FEATURE 2 — OFFLINE EPISODE CACHE (Cache API)
// ═══════════════════════════════════════════════════════════════
const Offline = {
  CACHE_NAME: 'wavefinder-episodes-v1',
  _meta: {},   // {trackId: {title, show, art, url, size, ts}}

  load() {
    try { this._meta = JSON.parse(localStorage.getItem(LS_CACHE)) || {}; } catch { this._meta = {}; }
  },

  saveMeta() {
    localStorage.setItem(LS_CACHE, JSON.stringify(this._meta));
  },

  isCached(trackId) {
    return !!this._meta[String(trackId)];
  },

  async download(ep, show) {
    const src = ep.episodeUrl || ep.trackViewUrl || '';
    if (!src) { toast('No audio URL to cache'); return; }
    if (!('caches' in window)) { toast('Cache API not available in this browser'); return; }
    const tid = String(ep.trackId);
    toast('Downloading for offline\u2026');
    try {
      const cache = await caches.open(this.CACHE_NAME);
      const proxied = PROXY + encodeURIComponent(src);
      const resp = await fetch(proxied);
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      await cache.put(proxied, resp.clone());
      const size = +resp.headers.get('content-length') || 0;
      this._meta[tid] = {
        title: strip(ep.trackName||''), show: show?.collectionName||'',
        art: show?.artworkUrl100||'', url: proxied,
        size, ts: Date.now(), trackId: ep.trackId,
      };
      this.saveMeta();
      toast('\u2713 Saved offline: ' + strip(ep.trackName||'').substring(0,36));
      updateEpHighlights();
    } catch(e) {
      toast('Download failed: ' + e.message);
    }
  },

  async remove(trackId) {
    const tid = String(trackId);
    const meta = this._meta[tid];
    if (!meta) return;
    try {
      const cache = await caches.open(this.CACHE_NAME);
      await cache.delete(meta.url);
    } catch {}
    delete this._meta[tid];
    this.saveMeta();
    toast('Removed from offline cache');
    updateEpHighlights();
  },

  // Returns cached URL if available, otherwise null
  async getCachedUrl(src) {
    if (!('caches' in window)) return null;
    try {
      const cache  = await caches.open(this.CACHE_NAME);
      const match  = await cache.match(PROXY + encodeURIComponent(src));
      if (match) return URL.createObjectURL(await match.blob());
    } catch {}
    return null;
  },

  sizeStr(bytes) {
    if (!bytes) return '';
    if (bytes > 1e6) return (bytes/1e6).toFixed(0) + ' MB';
    return (bytes/1e3).toFixed(0) + ' KB';
  },
};

// ═══════════════════════════════════════════════════════════════
// FEATURE 3 — CHAPTER SUPPORT
// Parses <psc:chapters> or <podcast:chapters> from RSS feed
// ═══════════════════════════════════════════════════════════════
const Chapters = {
  _chapters: [],   // [{time, title, url}]  time in seconds
  _ep: null,

  async load(ep, feedUrl) {
    this._chapters = [];
    this._ep = ep;
    if (!feedUrl) return;
    try {
      // Try podcast:chapters JSON format first (Podcastindex namespace)
      const chUrl = ep.chaptersUrl || null;
      if (chUrl) {
        const r = await fetch(PROXY + encodeURIComponent(chUrl));
        if (r.ok) {
          const d = await r.json();
          if (d.chapters?.length) {
            this._chapters = d.chapters.map(ch => ({
              time: ch.startTime || 0,
              title: ch.title || '',
              url: ch.img || '',
            }));
            return;
          }
        }
      }
      // Fall back to RSS feed psc:chapters
      const res  = await fetch(PROXY + encodeURIComponent(feedUrl));
      const text = await res.text();
      const doc  = new DOMParser().parseFromString(text, 'text/xml');
      // Find item matching this episode
      const items = [...doc.querySelectorAll('item')];
      const item  = items.find(it => {
        const enc = it.querySelector('enclosure')?.getAttribute('url') || '';
        return enc.includes(ep.trackId) || enc === (ep.episodeUrl||'');
      }) || items[0];
      if (!item) return;
      const chEls = item.querySelectorAll('chapter');
      if (chEls.length) {
        this._chapters = [...chEls].map(ch => ({
          time:  this._parseTime(ch.getAttribute('start') || '0'),
          title: ch.getAttribute('title') || '',
        }));
      }
    } catch {}
  },

  _parseTime(str) {
    // Parses "HH:MM:SS" or "MM:SS" or raw seconds
    if (!str) return 0;
    const parts = String(str).split(':').map(Number);
    if (parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
    if (parts.length === 2) return parts[0]*60 + parts[1];
    return +str || 0;
  },

  render() {
    const existing = $('chaptersPanel');
    if (existing) existing.remove();
    if (!this._chapters.length) return;

    const panel = document.createElement('div');
    panel.id = 'chaptersPanel';
    panel.className = 'chapters-panel';
    panel.innerHTML = `<div class="chapters-header" onclick="Chapters.toggle()">
      <h4>\uD83D\uDDD2 Chapters (${this._chapters.length})</h4>
      <span id="chapToggle">\u25bc</span>
    </div>
    <div class="chapters-list" id="chaptersList" style="display:none">
      ${this._chapters.map((ch, i) =>
        `<div class="chapter-item" data-ch="${i}" onclick="Chapters.jumpTo(${i})">
          <span class="ch-active-dot"></span>
          <span class="ch-time">${fmtTime(ch.time)}</span>
          <span class="ch-title">${esc(ch.title)}</span>
        </div>`
      ).join('')}
    </div>`;

    const epWrap = $('mainInner');
    if (epWrap) epWrap.appendChild(panel);
    this.updateActive(0);
  },

  toggle() {
    const list = $('chaptersList');
    const tog  = $('chapToggle');
    if (!list) return;
    const open = list.style.display === 'none';
    list.style.display = open ? 'block' : 'none';
    if (tog) tog.textContent = open ? '\u25b2' : '\u25bc';
  },

  jumpTo(i) {
    const ch = this._chapters[i];
    if (!ch) return;
    const el = currentIsVideo() ? $('videoEl') : audio;
    if (el) el.currentTime = ch.time;
    this.updateActive(i);
  },

  updateActive(i) {
    document.querySelectorAll('.chapter-item').forEach((el, idx) =>
      el.classList.toggle('active', idx === i)
    );
  },

  tick(currentTime) {
    if (!this._chapters.length) return;
    let active = 0;
    for (let i = 0; i < this._chapters.length; i++) {
      if (currentTime >= this._chapters[i].time) active = i;
    }
    this.updateActive(active);
  },
};

// ═══════════════════════════════════════════════════════════════
// FEATURE 4 — IMPORT JSON FAVOURITES
// ═══════════════════════════════════════════════════════════════
function importFavs() {
  $('importInput').click();
}

document.addEventListener('DOMContentLoaded', () => {
  const inp = $('importInput');
  if (!inp) return;
  inp.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const imported = JSON.parse(ev.target.result);
        if (!Array.isArray(imported)) throw new Error('Expected an array');
        let added = 0;
        for (const f of imported) {
          if (!f.collectionId) continue;
          if (!S.favs.some(x => x.collectionId === f.collectionId)) {
            S.favs.push({
              collectionId:   f.collectionId,
              collectionName: f.collectionName || 'Unknown',
              artworkUrl100:  f.artworkUrl100  || '',
              artistName:     f.artistName     || '',
            });
            added++;
          }
        }
        saveFavs();
        renderFavs();
        toast(`\u2713 Imported ${added} favourite${added!==1?'s':''}`);
      } catch(err) {
        toast('Import failed: ' + err.message);
      }
      inp.value = '';  // reset so same file can be re-imported
    };
    reader.readAsText(file);
  });
});

function init() {
  // Theme
  const savedTheme = localStorage.getItem(LS_THEME) || 'light';
  setTheme(savedTheme);

  // Favs
  loadFavs();
  renderFavs();
  renderCategories();
  History.load();
  Offline.load();
  renderHistList();

  // Restore queue & playback position (without interrupting)
  loadQueue();
  updateQueueUI();

  // One-time episode click delegation — handlers set per-render via window._on*
  $('mainInner').addEventListener('click', e => {
    const pi = e.target.closest('[data-pi]');
    const qi = e.target.closest('[data-qi]');
    if (pi && window._onPlayClick)  window._onPlayClick(+pi.dataset.pi);
    else if (qi && window._onQueueClick) window._onQueueClick(+qi.dataset.qi);
  });
}

init();
</script>
