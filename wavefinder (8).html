<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WAVEFINDER — Podcast Discovery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── RESET ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button{cursor:pointer;font:inherit;border:none;background:none}
input{font:inherit;border:none;outline:none;background:none}
img{display:block}
a{color:inherit;text-decoration:none}
ul{list-style:none}

/* ── TOKENS ── */
:root{
  --sans: 'DM Sans', sans-serif;
  --serif: 'DM Serif Display', Georgia, serif;
  --mono: 'JetBrains Mono', monospace;
  --ease: cubic-bezier(.25,.46,.45,.94);
  --ease-spring: cubic-bezier(.34,1.56,.64,1);

  /* Light */
  --bg:       #f7f5f0;
  --bg2:      #eeebe3;
  --bg3:      #e4e0d6;
  --surface:  #ffffff;
  --border:   #d8d4ca;
  --border2:  #c8c3b8;
  --text:     #1a1814;
  --text2:    #5a5650;
  --text3:    #8a8680;
  --accent:   #c8440c;
  --accent2:  #e05a20;
  --accentBg: rgba(200,68,12,.08);
  --accentBg2:rgba(200,68,12,.15);
  --playing:  #0d7e3c;
  --playingBg:rgba(13,126,60,.08);
  --wave1:    #c8440c;
  --wave2:    #e8a030;
  --shadow:   0 1px 3px rgba(26,24,20,.08), 0 4px 16px rgba(26,24,20,.06);
  --shadow2:  0 2px 8px rgba(26,24,20,.12), 0 8px 32px rgba(26,24,20,.08);
}

[data-theme="dark"]{
  --bg:       #111009;
  --bg2:      #1a1814;
  --bg3:      #222018;
  --surface:  #1e1c14;
  --border:   #2e2c22;
  --border2:  #3e3c30;
  --text:     #f0ece2;
  --text2:    #a09c90;
  --text3:    #60594e;
  --accent:   #e8622a;
  --accent2:  #ff8050;
  --accentBg: rgba(232,98,42,.1);
  --accentBg2:rgba(232,98,42,.2);
  --playing:  #22c55e;
  --playingBg:rgba(34,197,94,.1);
  --shadow:   0 1px 3px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.2);
  --shadow2:  0 2px 8px rgba(0,0,0,.4), 0 8px 32px rgba(0,0,0,.3);
}

/* ── BASE ── */
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}

/* ── LAYOUT ── */
.layout{display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:280px 1fr;
  height:100vh;overflow:hidden}
.header{grid-column:1/-1;grid-row:1;border-bottom:1px solid var(--border);
  background:var(--surface);display:flex;align-items:center;gap:16px;
  padding:0 20px;height:60px;z-index:100;box-shadow:var(--shadow)}
.sidebar{grid-column:1;grid-row:2;border-right:1px solid var(--border);
  background:var(--bg2);overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column}
.main{grid-column:2;grid-row:2;overflow-y:auto;overflow-x:hidden}
.player-bar{grid-column:1/-1;grid-row:3;border-top:1px solid var(--border);
  background:var(--surface);z-index:100;box-shadow:0 -2px 12px rgba(0,0,0,.06);
  transition:height .25s cubic-bezier(.4,0,.2,1);overflow:hidden}
.player-bar.idle{height:36px;box-shadow:none;border-top-color:transparent}
.player-bar.idle .player-art,
.player-bar.idle .player-info,
.player-bar.idle .player-center,
.player-bar.idle .player-right{opacity:0;pointer-events:none;transition:opacity .2s}
.player-idle-hint{display:none;align-items:center;justify-content:center;height:36px;
  font-size:11px;color:var(--text3);gap:8px;letter-spacing:.04em}
.player-bar.idle .player-idle-hint{display:flex}

/* ── HEADER ── */
.logo{font-family:var(--serif);font-size:20px;color:var(--accent);
  letter-spacing:-.3px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.logo-wave{display:flex;align-items:flex-end;gap:2px;height:18px}
.logo-wave span{width:3px;border-radius:3px;background:var(--accent);
  animation:logowave 1.2s ease-in-out infinite;transform-origin:bottom}
.logo-wave span:nth-child(1){height:8px;animation-delay:0s}
.logo-wave span:nth-child(2){height:14px;animation-delay:.1s}
.logo-wave span:nth-child(3){height:10px;animation-delay:.2s}
.logo-wave span:nth-child(4){height:16px;animation-delay:.3s}
.logo-wave span:nth-child(5){height:6px;animation-delay:.4s}
@keyframes logowave{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.5)}}

.search-form{flex:1;max-width:480px;display:flex;align-items:center;
  background:var(--bg2);border:1px solid var(--border);border-radius:10px;
  padding:0 14px;gap:10px;transition:border-color .15s,box-shadow .15s}
.search-form:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentBg)}
.search-form svg{flex-shrink:0;opacity:.4}
.search-form input{flex:1;padding:10px 0;font-size:13px;color:var(--text);
  background:transparent}
.search-form input::placeholder{color:var(--text3)}
.btn-search{padding:6px 14px;background:var(--accent);color:#fff;border-radius:7px;
  font-size:12px;font-weight:600;letter-spacing:.3px;transition:background .15s,transform .1s}
.btn-search:hover{background:var(--accent2)}
.btn-search:active{transform:scale(.96)}

.header-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.btn-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;color:var(--text2);transition:background .15s,color .15s}
.btn-icon:hover{background:var(--bg2);color:var(--text)}
.btn-icon svg{width:18px;height:18px}
.badge{position:absolute;top:4px;right:4px;width:8px;height:8px;
  border-radius:50%;background:var(--accent);border:2px solid var(--surface)}

/* ── SIDEBAR ── */
.sidebar-section{padding:16px 14px 8px}
.sidebar-label{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text3);margin-bottom:8px}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cat-btn{padding:8px 10px;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;font-size:11px;font-weight:500;color:var(--text2);
  text-align:left;transition:all .15s;display:flex;align-items:center;gap:6px}
.cat-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accentBg)}
.cat-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accentBg)}
.cat-icon{font-size:14px}

.favorites-list{display:flex;flex-direction:column;gap:2px}
.fav-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;
  cursor:pointer;transition:background .15s}
.fav-item:hover{background:var(--bg3)}
.fav-item.active{background:var(--accentBg)}
.fav-thumb{width:32px;height:32px;border-radius:6px;object-fit:cover;flex-shrink:0;
  background:var(--bg3)}
.fav-name{font-size:12px;font-weight:500;color:var(--text);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.fav-remove{margin-left:auto;opacity:0;color:var(--text3);font-size:11px;
  padding:2px 4px;border-radius:4px;flex-shrink:0;transition:opacity .15s,color .15s}
.fav-item:hover .fav-remove{opacity:1}
.fav-remove:hover{color:var(--accent)}
.empty-favs{padding:16px;text-align:center;color:var(--text3);font-size:12px;
  font-style:italic;line-height:1.8}

/* ── MAIN AREA ── */
.main-inner{padding:24px}
.results-header{display:flex;align-items:baseline;gap:12px;margin-bottom:20px}
.results-title{font-family:var(--serif);font-size:24px;font-weight:400;color:var(--text)}
.results-count{font-size:12px;color:var(--text3);font-family:var(--mono)}

/* Podcast grid */
.podcast-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.podcast-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  overflow:hidden;cursor:pointer;transition:transform .2s var(--ease),
  box-shadow .2s var(--ease),border-color .2s;position:relative}
.podcast-card:hover{transform:translateY(-3px);box-shadow:var(--shadow2);border-color:var(--border2)}
.podcast-card.selected{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentBg)}
.pc-art{width:100%;aspect-ratio:1;object-fit:cover;background:var(--bg3)}
.pc-body{padding:12px}
.pc-name{font-size:12px;font-weight:600;color:var(--text);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  margin-bottom:4px}
.pc-artist{font-size:11px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-genre{font-size:10px;color:var(--accent);background:var(--accentBg);
  border-radius:3px;padding:2px 6px;display:inline-block;margin-top:4px;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.show-podcast-desc{font-size:12px;color:var(--text3);line-height:1.7;margin-top:6px;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.show-podcast-desc.expanded{display:block}
.show-desc-toggle{font-size:11px;color:var(--accent);background:none;border:none;
  padding:2px 0;cursor:pointer;margin-top:4px}
.pc-fav{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;
  background:rgba(255,255,255,.9);backdrop-filter:blur(4px);display:flex;align-items:center;
  justify-content:center;font-size:13px;opacity:0;transition:opacity .15s,transform .15s}
.podcast-card:hover .pc-fav,.pc-fav.is-fav{opacity:1}
.pc-fav:hover{transform:scale(1.15)}
.pc-fav.is-fav{background:var(--accent);color:#fff}

/* Episode list */
.ep-list-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.btn-back{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  color:var(--accent);padding:6px 12px;border:1px solid var(--accentBg2);border-radius:8px;
  background:var(--accentBg);transition:all .15s}
.btn-back:hover{background:var(--accentBg2)}
.show-meta{display:flex;align-items:center;gap:16px;
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:16px;margin-bottom:20px}
.show-art{width:80px;height:80px;border-radius:12px;object-fit:cover;flex-shrink:0;background:var(--bg3)}
.show-info{flex:1;min-width:0}
.show-name{font-family:var(--serif);font-size:20px;margin-bottom:4px}
.show-artist{font-size:12px;color:var(--text2);margin-bottom:6px}
.show-desc{font-size:12px;color:var(--text3);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.show-actions{display:flex;gap:8px;margin-top:10px}
.btn-sm{padding:5px 12px;border-radius:7px;font-size:11px;font-weight:600;
  border:1px solid var(--border);color:var(--text2);background:var(--bg2);
  transition:all .15s}
.btn-sm:hover{border-color:var(--accent);color:var(--accent);background:var(--accentBg)}
.btn-sm.is-fav{border-color:var(--accent);color:var(--accent);background:var(--accentBg)}

.ep-count{font-size:11px;color:var(--text3);font-family:var(--mono);margin-bottom:12px}
.ep-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:14px;margin-bottom:8px;cursor:pointer;transition:all .15s;
  display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start}
.ep-item:hover{border-color:var(--border2);box-shadow:var(--shadow)}
.ep-item.playing{border-color:var(--playing);background:var(--playingBg)}
.ep-item.queued{border-color:var(--border2);background:var(--bg2)}
.ep-num{font-family:var(--mono);font-size:10px;color:var(--text3);
  padding-top:2px;min-width:24px;text-align:right}
.ep-body{min-width:0}
.ep-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep-desc{font-size:11px;color:var(--text3);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep-meta{display:flex;align-items:center;gap:8px;margin-top:6px}
.ep-date{font-size:10px;color:var(--text3);font-family:var(--mono)}
.ep-dur{font-size:10px;color:var(--text3);font-family:var(--mono);
  background:var(--bg2);padding:2px 6px;border-radius:4px}
.ep-play-indicator{display:flex;align-items:center;justify-content:center;
  width:32px;height:32px;border-radius:50%;flex-shrink:0;margin-top:2px;
  background:var(--bg2);border:1px solid var(--border);color:var(--text2);
  transition:all .15s;font-size:12px}
.ep-item:hover .ep-play-indicator{background:var(--accent);border-color:var(--accent);color:#fff}
.ep-item.playing .ep-play-indicator{background:var(--playing);border-color:var(--playing);color:#fff}
.ep-item.queued .ep-play-indicator{background:var(--bg3);color:var(--accent)}
.queue-badge{position:absolute;top:-4px;right:-4px;background:var(--accent);color:#fff;
  border-radius:50%;width:14px;height:14px;font-size:8px;display:flex;
  align-items:center;justify-content:center;font-family:var(--mono)}

/* ── PLAYER BAR ── */
.player-bar{padding:0 20px;height:80px;display:flex;align-items:center;gap:16px}
.player-art{width:48px;height:48px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--bg3)}
.player-info{flex:0 0 200px;min-width:0}
.player-title{font-size:12px;font-weight:600;color:var(--text);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px}
.player-show{font-size:11px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player-center{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
.player-controls{display:flex;align-items:center;gap:8px}
.btn-ctrl{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;color:var(--text2);transition:all .15s;font-size:13px}
.btn-ctrl:hover{background:var(--bg2);color:var(--text);transform:scale(1.08)}
.btn-ctrl.skip{font-family:var(--mono);font-size:9px;font-weight:700;position:relative}
.btn-ctrl.skip span{position:absolute;font-size:7px;bottom:-1px}
.btn-play-main{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:16px;
  transition:all .15s;flex-shrink:0;box-shadow:0 2px 8px var(--accentBg2)}
.btn-play-main:hover{background:var(--accent2);transform:scale(1.06)}
.btn-play-main:active{transform:scale(.96)}
.player-progress{width:100%;display:flex;align-items:center;gap:8px}
.player-time{font-family:var(--mono);font-size:10px;color:var(--text3);min-width:36px;text-align:center}
.progress-track{flex:1;height:4px;background:var(--bg3);border-radius:2px;cursor:pointer;
  position:relative;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;
  transition:width .25s linear;max-width:100%}
.progress-track:hover .progress-fill{background:var(--accent2)}
.player-right{flex:0 0 160px;display:flex;align-items:center;gap:8px;justify-content:flex-end}
.vol-wrap{display:flex;align-items:center;gap:6px;flex:1}
.vol-slider{-webkit-appearance:none;appearance:none;width:80px;height:3px;border-radius:2px;
  background:var(--bg3);outline:none;cursor:pointer}
.vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;
  border-radius:50%;background:var(--accent);cursor:pointer}
.queue-count{font-family:var(--mono);font-size:10px;color:var(--text3);
  background:var(--bg2);padding:3px 8px;border-radius:10px;white-space:nowrap}

/* ── VIDEO PLAYER ── */
#videoWrap{position:fixed;z-index:500;background:#000;border-radius:10px;
  box-shadow:0 8px 40px rgba(0,0,0,.6);overflow:hidden;
  transition:all .3s cubic-bezier(.4,0,.2,1);display:none}
#videoWrap.pip{bottom:92px;right:16px;width:320px;height:180px;border-radius:10px}
#videoWrap.fullscreen-mode{inset:0;width:100%;height:100%;border-radius:0;
  bottom:auto;right:auto}
#videoEl{width:100%;height:100%;object-fit:contain;background:#000}
.video-controls{position:absolute;bottom:0;left:0;right:0;padding:8px 12px;
  background:linear-gradient(transparent,rgba(0,0,0,.8));
  display:flex;align-items:center;gap:8px;opacity:0;transition:opacity .2s}
#videoWrap:hover .video-controls{opacity:1}
.v-btn{background:none;border:none;color:#fff;font-size:14px;padding:4px 6px;
  cursor:pointer;border-radius:4px;transition:background .15s}
.v-btn:hover{background:rgba(255,255,255,.2)}
.v-progress{flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:2px;
  cursor:pointer;position:relative}
.v-fill{height:100%;background:#fff;border-radius:2px;max-width:100%;transition:width .25s linear}
.v-time{font-size:10px;color:rgba(255,255,255,.8);font-family:var(--mono);white-space:nowrap}
.video-pip-badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);
  color:#fff;font-size:9px;padding:2px 6px;border-radius:4px;pointer-events:none}

/* ── CHAPTERS ── */
.chapters-panel{margin-top:12px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.chapters-header{display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;background:var(--bg2);cursor:pointer;user-select:none}
.chapters-header h4{font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--text3);margin:0}
.chapters-list{max-height:240px;overflow-y:auto}
.chapter-item{display:flex;align-items:center;gap:10px;padding:8px 14px;
  cursor:pointer;transition:background .12s;border-top:1px solid var(--border)}
.chapter-item:hover{background:var(--bg2)}
.chapter-item.active{background:var(--accentBg)}
.ch-time{font-family:var(--mono);font-size:10px;color:var(--text3);
  flex-shrink:0;min-width:40px}
.ch-title{font-size:12px;color:var(--text);flex:1}
.ch-active-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);
  flex-shrink:0;opacity:0}
.chapter-item.active .ch-active-dot{opacity:1}

/* ── LISTEN HISTORY ── */
.hist-list{display:flex;flex-direction:column;gap:2px;max-height:300px;overflow-y:auto}
.hist-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;
  cursor:pointer;transition:background .12s}
.hist-item:hover{background:var(--bg3)}
.hist-thumb{width:28px;height:28px;border-radius:5px;object-fit:cover;
  flex-shrink:0;background:var(--bg3)}
.hist-body{flex:1;min-width:0}
.hist-ep{font-size:11px;font-weight:600;color:var(--text);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.hist-show{font-size:10px;color:var(--text3);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.hist-prog{height:2px;background:var(--bg3);border-radius:1px;margin-top:3px}
.hist-prog-fill{height:100%;background:var(--accent);border-radius:1px;max-width:100%}

/* ── OFFLINE BADGE ── */
.ep-offline-badge{display:inline-flex;align-items:center;gap:3px;
  background:rgba(34,197,94,.1);color:#16a34a;border:1px solid rgba(34,197,94,.25);
  border-radius:4px;font-size:9px;font-weight:700;padding:2px 5px;
  letter-spacing:.04em;cursor:pointer;transition:all .15s}
.ep-offline-badge:hover{background:rgba(34,197,94,.2)}
.ep-offline-badge.cached{background:rgba(34,197,94,.15);color:#15803d}

/* ── PROGRESS RING on episode ── */
.ep-progress-ring{position:absolute;inset:0;border-radius:50%;pointer-events:none}

/* ── HISTORY SIDEBAR SECTION ── */
.sidebar-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:8px}
.sidebar-tab{flex:1;padding:6px;font-size:10px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--text3);cursor:pointer;text-align:center;
  border-bottom:2px solid transparent;transition:all .15s}
.sidebar-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.sidebar-pane{display:none}
.sidebar-pane.active{display:flex;flex-direction:column;gap:2px}

/* ── YOU MIGHT ALSO LIKE ── */
.also-section{margin-top:28px;padding-top:20px;border-top:1px solid var(--border)}
.also-header{font-family:var(--serif);font-size:18px;color:var(--text);margin-bottom:4px}
.also-sub{font-size:11px;color:var(--text3);margin-bottom:16px}
.also-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.also-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  overflow:hidden;cursor:pointer;transition:transform .2s var(--ease),
  box-shadow .2s,border-color .2s}
.also-card:hover{transform:translateY(-2px);box-shadow:var(--shadow2);border-color:var(--border2)}
.also-art{width:100%;aspect-ratio:1;object-fit:cover;background:var(--bg3)}
.also-body{padding:8px 10px}
.also-name{font-size:11px;font-weight:600;color:var(--text);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.also-artist{font-size:10px;color:var(--text3);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;margin-top:2px}

/* ── VIDEO BADGE ── */
.ep-video-badge{display:inline-flex;align-items:center;gap:3px;
  background:rgba(59,130,246,.12);color:#3b82f6;border:1px solid rgba(59,130,246,.25);
  border-radius:4px;font-size:9px;font-weight:700;padding:2px 5px;
  letter-spacing:.04em;vertical-align:middle;margin-left:6px}

/* ── EPISODE DESC EXPAND ── */
.ep-desc{font-size:11px;color:var(--text3);line-height:1.65;margin-top:4px}
.ep-desc-inner{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
  overflow:hidden;transition:all .2s}
.ep-desc-inner.expanded{display:block;-webkit-line-clamp:unset}
.ep-desc-toggle{font-size:10px;color:var(--accent);background:none;border:none;
  padding:2px 0;cursor:pointer;margin-top:2px;display:none}
.ep-desc-toggle.visible{display:block}

/* ── QUEUE PANEL ── */
.queue-panel{position:fixed;right:0;top:60px;bottom:80px;width:320px;
  background:var(--surface);border-left:1px solid var(--border);
  box-shadow:var(--shadow2);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .25s var(--ease);z-index:200}
.queue-panel.open{transform:none}
.queue-header{padding:16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between}
.queue-header h3{font-size:14px;font-weight:600}
.queue-list{flex:1;overflow-y:auto;padding:8px}
.queue-ep{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;
  cursor:pointer;transition:background .15s;position:relative}
.queue-ep:hover{background:var(--bg2)}
.queue-ep.now{background:var(--playingBg)}
.queue-ep-art{width:40px;height:40px;border-radius:6px;object-fit:cover;flex-shrink:0;background:var(--bg3)}
.queue-ep-info{flex:1;min-width:0}
.queue-ep-title{font-size:11px;font-weight:600;color:var(--text);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.queue-ep-show{font-size:10px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ep-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.ep-queue-btn{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:13px;color:var(--text3);background:var(--bg2);
  border:1px solid var(--border);transition:all .15s;flex-shrink:0}
.ep-queue-btn:hover{background:var(--bg3);color:var(--text);border-color:var(--border2)}
.ep-queue-btn.in-queue{color:var(--accent);border-color:var(--accentBg2);background:var(--accentBg)}
.ep-queue-btn:disabled{opacity:.3;cursor:not-allowed}
.queue-ep-remove{color:var(--text3);font-size:14px;padding:4px;border-radius:4px;
  flex-shrink:0;opacity:0;transition:opacity .15s}
.queue-ep:hover .queue-ep-remove{opacity:1}

/* ── STATES ── */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px;gap:16px;color:var(--text3)}
.spinner{width:32px;height:32px;border:3px solid var(--bg3);
  border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:80px 40px;gap:12px;color:var(--text3);text-align:center}
.empty-icon{font-size:40px;opacity:.3}
.empty-text{font-size:14px;font-weight:500;color:var(--text2)}
.empty-sub{font-size:12px;line-height:1.7}
.load-more-wrap{display:flex;justify-content:center;padding:28px 0 8px;grid-column:1/-1}
.btn-load-more{padding:11px 32px;border:2px solid var(--border2);border-radius:40px;
  font-size:13px;font-weight:600;color:var(--text2);background:var(--surface);
  transition:all .2s var(--ease);letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.btn-load-more:hover{border-color:var(--accent);color:var(--accent);
  background:var(--accentBg);transform:translateY(-1px);box-shadow:var(--shadow)}
.btn-load-more:active{transform:none}
.btn-load-more:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-load-more .spinner{width:14px;height:14px;border-width:2px;display:none}
.btn-load-more.loading .spinner{display:block}
.btn-load-more.loading .lm-text{display:none}

.error-msg{background:rgba(200,68,12,.08);border:1px solid rgba(200,68,12,.2);
  border-radius:10px;padding:14px;color:var(--accent);font-size:12px;
  display:flex;align-items:center;gap:10px}

/* ── TOAST ── */
.toast-wrap{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);
  z-index:999;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--text);color:var(--bg);padding:8px 16px;border-radius:20px;
  font-size:12px;font-weight:500;animation:toastin .25s var(--ease-spring);white-space:nowrap}
@keyframes toastin{from{opacity:0;transform:translateY(12px) scale(.9)}to{opacity:1;transform:none}}

/* ── SCROLLBARS ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  .layout{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto}
  .sidebar{grid-column:1;grid-row:2;max-height:200px;overflow-y:auto;
    flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border)}
  .main{grid-column:1;grid-row:3}
  .player-info{flex:0 0 120px}
  .player-right{flex:0 0 80px}
}

/* ── ANIMATIONS ── */
.fade-in{animation:fadein .25s var(--ease) both}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card-enter{animation:cardenter .3s var(--ease-spring) both}
@keyframes cardenter{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="layout" id="app">

  <!-- HEADER -->
  <header class="header">
    <div class="logo">
      <div class="logo-wave">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      WAVEFINDER
    </div>
    <form class="search-form" id="searchForm">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Search podcasts by name…" autocomplete="off">
      <button class="btn-search" type="submit">Search</button>
    </form>
    <div class="header-actions">
      <button class="btn-icon" id="btnQueue" title="Queue" style="position:relative">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/>
          <line x1="8" y1="18" x2="21" y2="18"/>
          <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/>
          <line x1="3" y1="18" x2="3.01" y2="18"/>
        </svg>
        <span class="badge" id="queueBadge" style="display:none"></span>
      </button>
      <button class="btn-icon" id="btnTheme" title="Toggle theme">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42
                   M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Browse by Category</div>
      <div class="cat-grid" id="catGrid"></div>
    </div>
    <div class="sidebar-section" style="flex:1">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div class="sidebar-label" style="margin-bottom:0">Favourites</div>
        <div style="display:flex;gap:4px">
          <button onclick="importFavs()" title="Import favourites from JSON"
            style="font-size:10px;color:var(--text3);padding:2px 8px;border:1px solid var(--border);
            border-radius:5px;background:transparent;cursor:pointer;transition:all .15s;white-space:nowrap"
            onmouseover="this.style.color='var(--accent)';this.style.borderColor='var(--accent)'"
            onmouseout="this.style.color='var(--text3)';this.style.borderColor='var(--border)'">⬆ Import</button>
          <button onclick="downloadFavs()" title="Export favourites as JSON"
            style="font-size:10px;color:var(--text3);padding:2px 8px;border:1px solid var(--border);
            border-radius:5px;background:transparent;cursor:pointer;transition:all .15s;white-space:nowrap"
            onmouseover="this.style.color='var(--accent)';this.style.borderColor='var(--accent)'"
            onmouseout="this.style.color='var(--text3)';this.style.borderColor='var(--border)'">⬇ Export</button>
        </div>
        <input type="file" id="importInput" accept=".json" style="display:none">
      </div>
      <div class="sidebar-tabs">
        <div class="sidebar-tab active" onclick="switchSideTab('favs',this)">Saved</div>
        <div class="sidebar-tab" onclick="switchSideTab('hist',this)">History</div>
      </div>
      <div class="sidebar-pane active" id="pane-favs">
        <div class="favorites-list" id="favsList">
          <div class="empty-favs">No favourites yet.<br>★ a show to save it here.</div>
        </div>
      </div>
      <div class="sidebar-pane" id="pane-hist">
        <div class="hist-list" id="histList">
          <div class="empty-favs">No listen history yet.</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="main-inner" id="mainInner">
      <!-- Content injected here -->
      <div class="empty fade-in">
        <div class="empty-icon">🎙</div>
        <div class="empty-text">Discover Podcasts</div>
        <div class="empty-sub">Search by name or browse a category<br>to find your next favourite show</div>
      </div>
    </div>
  </main>

  <!-- PLAYER BAR -->
  <div class="player-bar idle" id="playerBar">
    <div class="player-idle-hint">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" style="opacity:.4">
        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
      </svg>
      Nothing playing
    </div>
    <img class="player-art" id="playerArt" src="" alt="">
    <div class="player-info">
      <div class="player-title" id="playerTitle">Nothing playing</div>
      <div class="player-show" id="playerShow">—</div>
    </div>
    <div class="player-center">
      <div class="player-controls">
        <button class="btn-ctrl skip" id="btnBack30" title="Back 30s">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
          </svg>
          <span>30</span>
        </button>
        <button class="btn-ctrl" id="btnPrev" title="Previous">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
          </svg>
        </button>
        <button class="btn-play-main" id="btnPlayPause">
          <svg id="playIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </button>
        <button class="btn-ctrl" id="btnNext" title="Next">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 18l8.5-6L6 6v12zm2.5-6 8.5 6V6z" opacity="0"/>
            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
          </svg>
        </button>
        <button class="btn-ctrl skip" id="btnFwd30" title="Forward 30s">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/>
          </svg>
          <span>30</span>
        </button>
      </div>
      <div class="player-progress">
        <span class="player-time" id="timeEl">0:00</span>
        <div class="progress-track" id="progressTrack">
          <div class="progress-fill" id="progressFill" style="width:0%"></div>
        </div>
        <span class="player-time" id="durEl">0:00</span>
      </div>
    </div>
    <div class="player-right">
      <div class="vol-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0;opacity:.4">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
        </svg>
        <input type="range" class="vol-slider" id="volSlider" min="0" max="1" step=".02" value="1">
      </div>
      <div class="queue-count" id="queueCount" style="display:none"></div>
    </div>
  </div>

</div>

<!-- QUEUE PANEL -->
<div class="queue-panel" id="queuePanel">
  <div class="queue-header">
    <h3>Up Next</h3>
    <div style="display:flex;gap:8px;align-items:center">
      <button id="btnClearQueue" style="font-size:11px;color:var(--text3);padding:4px 8px;
        border:1px solid var(--border);border-radius:6px" class="btn-sm">Clear</button>
      <button class="btn-icon" id="btnCloseQueue" style="width:28px;height:28px;font-size:16px;
        color:var(--text3)">✕</button>
    </div>
  </div>
  <div class="queue-list" id="queueList"></div>
</div>

<!-- TOAST -->
<div class="toast-wrap" id="toastWrap"></div>

<!-- AUDIO -->
<audio id="audioEl" preload="none"></audio>

<!-- VIDEO PLAYER (PiP + fullscreen) -->
<div id="videoWrap">
  <span class="video-pip-badge">▶ VIDEO</span>
  <video id="videoEl" preload="none" playsinline></video>
  <div class="video-controls">
    <button class="v-btn" id="vBtnPlay" onclick="VP.togglePlay()">⏸</button>
    <button class="v-btn" onclick="VP.skip(-30)" title="Back 30s" style="font-size:10px">⟨30</button>
    <button class="v-btn" onclick="VP.skip(30)"  title="Fwd 30s"  style="font-size:10px">30⟩</button>
    <div class="v-progress" id="vProgress"><div class="v-fill" id="vFill"></div></div>
    <span class="v-time" id="vTime">0:00</span>
    <button class="v-btn" id="vBtnPip"   title="Picture-in-Picture" onclick="VP.togglePip()">⧉</button>
    <button class="v-btn" id="vBtnFs"    title="Fullscreen"         onclick="VP.toggleFs()">⛶</button>
    <button class="v-btn" onclick="VP.close()" title="Close">✕</button>
  </div>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════
// VIDEO PLAYER CONTROLLER
// ═══════════════════════════════════════════════════════════════
const VP = {
  _isFs: false,

  show(src, title) {
    const wrap = document.getElementById('videoWrap');
    const vel  = document.getElementById('videoEl');
    vel.src    = PROXY + encodeURIComponent(src);
    vel.load();
    vel.play().catch(() => {});
    wrap.style.display = 'block';
    wrap.className = 'pip';     // start in PiP
    document.getElementById('vBtnPlay').textContent = '⏸';
    this._isFs = false;
    // Sync audio element — pause it when video plays
    const aud = document.getElementById('audioEl');
    aud.pause();
  },

  close() {
    // Hide overlay but keep src/position so video can resume.
    // Clearing src would require a full re-fetch to re-open.
    const wrap = document.getElementById('videoWrap');
    const vel  = document.getElementById('videoEl');
    if (vel && !vel.paused) vel.pause();
    if (wrap) {
      wrap.style.display = 'none';
      if (this._isFs && document.fullscreenElement) {
        document.exitFullscreen().catch(()=>{});
      }
      wrap.classList.remove('fullscreen-mode');
      this._isFs = false;
    }
    // Update player bar to show paused state
    const pIcon = document.getElementById('playIcon');
    if (pIcon) pIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
  },

  // Reopen the video overlay (same src, pick up where left off)
  reopen() {
    const wrap = document.getElementById('videoWrap');
    const vel  = document.getElementById('videoEl');
    if (!wrap || !vel || !vel.src) return;
    wrap.style.display = 'block';
    wrap.className = 'pip';
    vel.play().catch(()=>{});
  },

  skip(secs) {
    const vel = document.getElementById('videoEl');
    vel.currentTime = Math.max(0, Math.min(vel.duration||Infinity, vel.currentTime + secs));
  },

  togglePip() {
    // CSS-only PiP — keeps video in our overlay at fixed bottom-right corner.
    // We do NOT use the native browser PiP API because that removes the
    // video element from our DOM overlay entirely, causing it to disappear.
    const wrap = document.getElementById('videoWrap');
    if (!wrap) return;
    if (this._isFs) {
      // If fullscreen, exit fullscreen first and return to pip
      this._isFs = false;
      wrap.classList.remove('fullscreen-mode');
      wrap.classList.add('pip');
      if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
      const btn = document.getElementById('vBtnFs');
      if (btn) btn.textContent = '⛶';
    }
    // PiP is the default/only non-fullscreen mode — button is visual indicator
    // Nothing to toggle: pip is always shown unless fullscreen
  },

  toggleFs() {
    const wrap = document.getElementById('videoWrap');
    this._isFs = !this._isFs;
    wrap.classList.toggle('fullscreen-mode', this._isFs);
    wrap.classList.toggle('pip', !this._isFs);
    document.getElementById('vBtnFs').textContent = this._isFs ? '⊡' : '⛶';
    if (this._isFs && document.fullscreenEnabled) {
      wrap.requestFullscreen().catch(() => {});
    } else if (document.fullscreenElement) {
      document.exitFullscreen().catch(() => {});
    }
  },

  togglePlay() {
    const vel = document.getElementById('videoEl');
    if (!vel) return;
    vel.paused ? vel.play().catch(()=>{}) : vel.pause();
  },

  update() {
    const vel  = document.getElementById('videoEl');
    const fill = document.getElementById('vFill');
    const time = document.getElementById('vTime');
    const dur  = vel.duration || 0;
    const cur  = vel.currentTime;
    if (fill) fill.style.width = dur ? (cur / dur * 100) + '%' : '0%';
    if (time) time.textContent = fmtTime(cur) + ' / ' + fmtTime(dur);
  },
};

// Wire video events after DOM ready
document.addEventListener('DOMContentLoaded', () => {
  const vel  = document.getElementById('videoEl');
  const vPrg = document.getElementById('vProgress');
  const vBtn = document.getElementById('vBtnPlay');
  if (!vel) return;

  vel.addEventListener('timeupdate', () => {
    VP.update();
    // Sync bottom player bar progress and times
    if (currentIsVideo()) {
      const cur = vel.currentTime;
      const dur = vel.duration || 0;
      const te  = document.getElementById('timeEl');
      const de  = document.getElementById('durEl');
      const pf  = document.getElementById('progressFill');
      if (te) te.textContent = fmtTime(cur);
      if (de) de.textContent = fmtTime(dur);
      if (pf) pf.style.width = dur ? (cur/dur*100)+'%' : '0%';
    }
  });
  vel.addEventListener('play', () => {
    if (vBtn) vBtn.textContent = '\u23f8';
    // Sync bottom player bar icon
    const pIcon = document.getElementById('playIcon');
    if (pIcon) pIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
  });
  vel.addEventListener('pause', () => {
    if (vBtn) vBtn.textContent = '\u25b6';
    // Sync bottom player bar icon
    const pIcon = document.getElementById('playIcon');
    if (pIcon) pIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
  });
  vel.addEventListener('ended', () => {
    VP.close();
    // Advance audio queue
    if (S.queueIdx < S.queue.length - 1) playQueue(S.queueIdx + 1);
  });

  if (vPrg) {
    vPrg.addEventListener('click', e => {
      const dur = vel.duration;
      if (!dur) return;
      vel.currentTime = (e.offsetX / vPrg.offsetWidth) * dur;
    });
  }

  // Exit fullscreen when Escape pressed
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && VP._isFs) {
      VP._isFs = false;
      const wrap = document.getElementById('videoWrap');
      if (wrap) {
        wrap.classList.remove('fullscreen-mode');
        wrap.classList.add('pip');
      }
      const btn = document.getElementById('vBtnFs');
      if (btn) btn.textContent = '⛶';
    }
  });
});


// ═══════════════════════════════════════════════════════════════
// CONSTANTS

const LS_FAV  = 'wavefinder_favs';
const LS_Q    = 'wavefinder_queue';

const LS_HIST   = 'wavefinder_history';   // listen history
const LS_RESUME = 'wavefinder_resume';    // per-episode position {trackId: seconds}

// ═══════════════════════════════════════════════════════════════
// SEARCH CACHE
// Simple TTL cache — avoids repeat API calls and rate limit hits.
// Keyed by search term or category id.
// ═══════════════════════════════════════════════════════════════
const searchCache = new Map();  // key → {results:[], ts:Date.now()}

function cacheGet(key) {
  const entry = searchCache.get(key);
  if (!entry) return null;
  if (Date.now() - entry.ts > CACHE_TTL) { searchCache.delete(key); return null; }
  return entry.results;
}

function cacheSet(key, results) {
  searchCache.set(key, { results, ts: Date.now() });
  // Keep cache from growing unbounded — evict oldest if over 20 entries
  if (searchCache.size > 20) {
    const oldest = [...searchCache.entries()]
      .sort((a, b) => a[1].ts - b[1].ts)[0][0];
    searchCache.delete(oldest);
  }
}

  searchCat:    '',    // current category (empty = text search)

// UTILS
// ═══════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const proxyImg = url => url ? PROXY + encodeURIComponent(url) : '';
// Upsize iTunes artwork URL and route through proxy.
// iTunes serves any size — swap the embedded dimensions string.
const artImg = (url, size=400) => {
  if (!url) return '';
  const sized = url.replace(/\d+x\d+bb/, size + 'x' + size + 'bb');
  return proxyImg(sized);
};
const fmtTime = s => {
  if (isNaN(s) || !isFinite(s)) return '0:00';
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = Math.floor(s%60);
  if (h) return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  return `${m}:${String(sec).padStart(2,'0')}`;
};
const fmtDate = ds => {
  if (!ds) return '';
  try { return new Date(ds).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
  catch { return ds.slice(0,10); }
};
const strip = html => {
  const d = document.createElement('div');
  d.innerHTML = html || '';
  return d.textContent.trim();
};
const toast = (msg, dur=2500) => {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  $('toastWrap').appendChild(el);
  setTimeout(() => el.style.opacity='0', dur-300);
  setTimeout(() => el.remove(), dur);
};

async function fetchJSON(url) {
  const proxied = PROXY + encodeURIComponent(url);
  const r = await fetch(proxied);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function loadFavs() {
  try { S.favs = JSON.parse(localStorage.getItem(LS_FAV)) || []; } catch { S.favs = []; }
}
function saveFavs() {
  localStorage.setItem(LS_FAV, JSON.stringify(S.favs));
}
function isFav(id) { return S.favs.some(f => f.collectionId === id); }

function toggleFav(podcast, e) {
  if (e) e.stopPropagation();
  if (isFav(podcast.collectionId)) {
    S.favs = S.favs.filter(f => f.collectionId !== podcast.collectionId);
    toast('Removed from favourites');
  } else {
    S.favs.push({
      collectionId:   podcast.collectionId,
      collectionName: podcast.collectionName,
      artworkUrl100:  podcast.artworkUrl100,
      artistName:     podcast.artistName,
    });
    toast('★ Added to favourites');
  }
  saveFavs();
  renderFavs();
  // Update any visible star buttons
  document.querySelectorAll('[data-fav-id]').forEach(btn => {
    if (+btn.dataset.favId === podcast.collectionId) {
      btn.classList.toggle('is-fav', isFav(podcast.collectionId));
      btn.title = isFav(podcast.collectionId) ? 'Remove favourite' : 'Add favourite';
      btn.textContent = isFav(podcast.collectionId) ? '★' : '☆';
    }
  });
}

function downloadFavs() {
  const blob = new Blob([JSON.stringify(S.favs, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'wavefinder-favourites.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

// ═══════════════════════════════════════════════════════════════
// QUEUE / AUDIO
// ═══════════════════════════════════════════════════════════════
const audio = $('audioEl');

function saveQueue() {
  try {
    localStorage.setItem(LS_Q,   JSON.stringify(S.queue));
    localStorage.setItem(LS_NOW, String(S.queueIdx));
    localStorage.setItem(LS_POS, String(audio.currentTime || 0));
  } catch {}
}
function loadQueue() {
  try {
    S.queue    = JSON.parse(localStorage.getItem(LS_Q))    || [];
    S.queueIdx = parseInt(localStorage.getItem(LS_NOW));
    if (isNaN(S.queueIdx)) S.queueIdx = -1;
    const pos  = parseFloat(localStorage.getItem(LS_POS))  || 0;

    if (!S.queue.length || S.queueIdx < 0 || S.queueIdx >= S.queue.length) return;

    const item = S.queue[S.queueIdx];
    const src  = item.ep.episodeUrl || item.ep.trackViewUrl || '';
    if (!src) return;

    audio.src = PROXY + encodeURIComponent(src);
    audio.load();
    updatePlayerUI(item);
    updateQueueUI();

    // Seek to saved position once enough metadata is loaded.
    // 'loadedmetadata' fires when duration is known — safe to set currentTime.
    // We need a one-time listener so it doesn't re-seek on subsequent loads.
    const seekOnce = () => {
      if (pos > 0 && isFinite(pos)) {
        audio.currentTime = pos;
        // Show resume toast with timestamp so user knows where they left off
        const label = strip(item.ep.trackName) || 'episode';
        toast('\u23f8 Paused at ' + fmtTime(pos) + ' — press \u25b6 to resume');
      }
    };
    $('playerBar').classList.remove('idle');  // show bar for restored session
    audio.addEventListener('loadedmetadata', seekOnce, {once: true});
    // Fallback: some proxied streams don't fire loadedmetadata until play()
    // Use canplay as a second attempt
    audio.addEventListener('canplay', () => {
      if (pos > 0 && Math.abs(audio.currentTime - pos) > 2) {
        audio.currentTime = pos;
      }
    }, {once: true});

  } catch(e) {
    console.warn('loadQueue failed:', e);
    S.queue = []; S.queueIdx = -1;
  }
}

function addToQueue(ep, show, playNow=false) {
  // Check if already in queue
  const exists = S.queue.findIndex(i => i.ep.trackId === ep.trackId);
  if (exists >= 0 && !playNow) { toast('Already in queue'); return; }

  if (playNow) {
    if (exists >= 0) S.queue.splice(exists, 1);
    // Insert after current
    const insertAt = S.queueIdx >= 0 ? S.queueIdx + 1 : 0;
    S.queue.splice(insertAt, 0, {ep, show});
    S.queueIdx = insertAt;
    playQueue(S.queueIdx);
  } else {
    if (exists < 0) S.queue.push({ep, show});
    if (S.queueIdx < 0) {
      S.queueIdx = 0;
      playQueue(0);
    } else {
      toast('Added to queue');
    }
  }
  saveQueue();
  updateQueueUI();
}

function isVideoEp(ep) {
  if (!ep) return false;
  if (ep.kind === 'podcast-video-episode' || ep.trackType === 'Video') return true;
  return !!(ep.episodeUrl && /\.(mp4|m4v|mov|webm|avi)(\?|$)/i.test(ep.episodeUrl));
}

function playQueue(idx) {
  if (idx < 0 || idx >= S.queue.length) { stopPlayback(); return; }
  S.queueIdx = idx;
  const item = S.queue[idx];
  const src  = item.ep.episodeUrl || item.ep.trackViewUrl || '';
  if (!src) { toast('No audio link for this episode'); playQueue(idx+1); return; }
  // Get saved resume position for this episode
  const resumePos = History.getPosition(item.ep.trackId);

  if (isVideoEp(item.ep)) {
    VP.show(src, strip(item.ep.trackName) || 'Video Episode');
    audio.pause();
    audio.src = '';
    // Seek video to saved position
    if (resumePos > 5) {
      const vel = $('videoEl');
      const doSeek = () => { if (resumePos < (vel.duration||0)-3) vel.currentTime = resumePos; };
      vel.addEventListener('loadedmetadata', doSeek, {once:true});
    }
    $('playerBar').classList.remove('idle');
  } else {
    VP.close();
    // Try cached version first, fall back to proxy
    Offline.getCachedUrl(src).then(cachedUrl => {
      audio.src = cachedUrl || PROXY + encodeURIComponent(src);
      audio.load();
      // Seek to resume position after metadata loads
      if (resumePos > 5) {
        const doSeek = () => { if (resumePos < (audio.duration||0)-3) audio.currentTime = resumePos; };
        audio.addEventListener('loadedmetadata', doSeek, {once:true});
        audio.addEventListener('canplay', doSeek, {once:true});
      }
      audio.play().catch(()=>{});
    });
  }
  // Load chapters for this episode (non-blocking)
  Chapters.load(item.ep, S.selected?.feedUrl || '').then(() => Chapters.render()).catch(()=>{});
  updatePlayerUI(item);
  updateEpHighlights();
  saveQueue();
  updateQueueUI();
}

function stopPlayback() {
  audio.pause();
  audio.src = '';
  S.playing = false;
  S.queueIdx = -1;
  $('playIcon').innerHTML = '<path d="M8 5v14l11-7z"/>';
  $('playerTitle').textContent = 'Nothing playing';
  $('playerShow').textContent  = '—';
  $('playerArt').src = '';
  $('playerBar').classList.add('idle');
}

function updatePlayerUI(item) {
  if (!item) return;
  $('playerTitle').textContent = strip(item.ep.trackName) || 'Untitled Episode';
  $('playerShow').textContent  = item.show?.collectionName || '';
  $('playerArt').src  = artImg(item.show?.artworkUrl100 || item.ep.artworkUrl100 || '', 200);
  $('playerArt').style.display = '';
  $('playerBar').classList.remove('idle');  // expand player bar
}

function updateQueueUI() {
  const panel = $('queueList');
  if (!S.queue.length) {
    panel.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text3);font-size:12px">Queue is empty</div>';
    $('queueCount').style.display = 'none';
    $('queueBadge').style.display = 'none';
    return;
  }
  $('queueCount').textContent = (S.queueIdx+1) + '/' + S.queue.length;
  $('queueCount').style.display = '';
  $('queueBadge').style.display = '';
  panel.innerHTML = S.queue.map((item,i) => {
    const title = strip(item.ep.trackName) || 'Untitled';
    const art   = artImg(item.show?.artworkUrl100 || item.ep.artworkUrl100 || '', 100);
    const isNow = i === S.queueIdx;
    return `<div class="queue-ep ${isNow?'now':''}" data-qi="${i}" onclick="QP.jumpTo(${i})">
      <img class="queue-ep-art" src="${esc(art)}" alt="">
      <div class="queue-ep-info">
        <div class="queue-ep-title">${esc(title)}</div>
        <div class="queue-ep-show">${esc(item.show?.collectionName||'')}</div>
      </div>
      <button class="queue-ep-remove" onclick="event.stopPropagation();QP.remove(${i})">✕</button>
    </div>`;
  }).join('');
}

function updateEpHighlights() {
  document.querySelectorAll('.ep-item').forEach(el => {
    const tid  = +el.dataset.tid;
    const cur  = S.queue[S.queueIdx];
    const isPlaying = cur && cur.ep.trackId === tid;
    const qPos = S.queue.findIndex((it, idx) => it.ep.trackId === tid && idx !== S.queueIdx);
    const isQueued  = qPos >= 0 && !isPlaying;

    el.classList.toggle('playing', isPlaying);
    el.classList.toggle('queued',  isQueued);

    // Play indicator
    const playInd = el.querySelector('.ep-play-indicator');
    if (playInd) playInd.textContent = isPlaying ? '\u23f8' : '\u25b6';

    // Queue button
    const qBtn = el.querySelector('.ep-queue-btn');
    if (qBtn) {
      qBtn.classList.toggle('in-queue', isQueued || isPlaying);
      qBtn.textContent = (isQueued || isPlaying) ? '\u2713' : '+';
      qBtn.title = isPlaying ? 'Now playing'
                 : isQueued  ? `In queue (#${qPos+1})`
                 : 'Add to queue';
    }
  });
}

// Queue Panel API
const QP = {
  jumpTo(i) { S.queueIdx = i; playQueue(i); },
  remove(i)  {
    if (i === S.queueIdx) {
      S.queue.splice(i,1);
      if (S.queue.length) playQueue(Math.min(i, S.queue.length-1));
      else stopPlayback();
    } else {
      S.queue.splice(i,1);
      if (i < S.queueIdx) S.queueIdx--;
    }
    saveQueue();
    updateQueueUI();
    updateEpHighlights();
  },
  clear() {
    S.queue = []; S.queueIdx = -1;
    stopPlayback(); saveQueue(); updateQueueUI(); updateEpHighlights();
  },
};

// ═══════════════════════════════════════════════════════════════
// AUDIO EVENTS
// ═══════════════════════════════════════════════════════════════
audio.addEventListener('play',  () => {
  S.playing = true;
  $('playIcon').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
});
audio.addEventListener('pause', () => {
  S.playing = false;
  $('playIcon').innerHTML = '<path d="M8 5v14l11-7z"/>';
});
audio.addEventListener('ended', () => {
  const item = S.queue[S.queueIdx];
  if (item?.ep) History.markPlayed(item.ep, item.show, audio.duration, audio.duration);
  if (S.queueIdx < S.queue.length - 1) playQueue(S.queueIdx + 1);
  else stopPlayback();
});
audio.addEventListener('pause', () => {
  const item = S.queue[S.queueIdx];
  if (item?.ep && audio.currentTime > 5) {
    History.savePosition(item.ep.trackId, audio.currentTime);
    History.markPlayed(item.ep, item.show, audio.currentTime, audio.duration);
  }
});
audio.addEventListener('timeupdate', () => {
  const cur  = audio.currentTime;
  const dur  = audio.duration || 0;
  $('timeEl').textContent  = fmtTime(cur);
  $('durEl').textContent   = fmtTime(dur);
  $('progressFill').style.width = dur ? (cur/dur*100)+'%' : '0%';
  // Save per-episode resume position every 5s
  if (Math.floor(cur) % 5 === 0) {
    saveQueue();
    const item = S.queue[S.queueIdx];
    if (item?.ep?.trackId) History.savePosition(item.ep.trackId, cur);
  }
  // Tick chapters
  Chapters.tick(cur);
});
audio.addEventListener('error', () => {
  toast('Audio error — trying next');
  if (S.queueIdx < S.queue.length - 1) playQueue(S.queueIdx + 1);
});

$('progressTrack').addEventListener('click', e => {
  const dur = audio.duration;
  if (!dur) return;
  const pct = e.offsetX / e.currentTarget.offsetWidth;
  audio.currentTime = pct * dur;
});
$('volSlider').addEventListener('input', e => { audio.volume = e.target.value; });
// Helper: returns true when a video episode is the current item
function currentIsVideo() {
  const item = S.queue[S.queueIdx];
  return item && isVideoEp(item.ep);
}

$('btnPlayPause').addEventListener('click', () => {
  if (currentIsVideo()) {
    const vel = document.getElementById('videoEl');
    const wrap = document.getElementById('videoWrap');
    if (!vel) return;
    if (vel.paused) {
      // Reopen overlay if closed, then play
      if (wrap && wrap.style.display === 'none') VP.reopen();
      else vel.play().catch(()=>{});
    } else {
      vel.pause();
    }
  } else {
    if (audio.paused) audio.play().catch(()=>{});
    else audio.pause();
  }
});
$('btnBack30').addEventListener('click', () => {
  if (currentIsVideo()) { VP.skip(-30); }
  else { audio.currentTime = Math.max(0, audio.currentTime-30); }
});
$('btnFwd30').addEventListener('click', () => {
  if (currentIsVideo()) { VP.skip(30); }
  else { audio.currentTime = Math.min(audio.duration||Infinity, audio.currentTime+30); }
});
$('btnPrev').addEventListener('click', () => { if (S.queueIdx > 0) playQueue(S.queueIdx-1); });
$('btnNext').addEventListener('click', () => { if (S.queueIdx < S.queue.length-1) playQueue(S.queueIdx+1); });

// ═══════════════════════════════════════════════════════════════
// SEARCH & BROWSE
// ═══════════════════════════════════════════════════════════════
async function searchPodcasts(term) {
  S.searchTerm  = term;
  S.searchCat   = '';
  S.shownCount  = 0;
  showLoading();
  try {
    // Check cache first — avoids redundant API calls and rate limit hits
    const cacheKey = 'search:' + term.toLowerCase().trim();
    let allResults = cacheGet(cacheKey);
    if (!allResults) {
      const url  = `${ITUNES}/search?media=podcast&limit=${API_LIMIT}&term=${encodeURIComponent(term)}`;
      const data = await fetchJSON(url);
      allResults = data.results || [];
      cacheSet(cacheKey, allResults);
    }
    S.allPodcasts = allResults;
    S.podcasts    = S.allPodcasts.slice(0, PAGE_SIZE);
    S.shownCount  = S.podcasts.length;
    renderPodcastGrid(S.podcasts, `Results for "${term}"`,
      S.allPodcasts.length, S.shownCount < S.allPodcasts.length);
  } catch(e) {
    showError('Search failed: ' + e.message);
  }
}

async function browseCategory(cat) {
  S.searchCat  = cat;
  S.searchTerm = '';
  S.shownCount = 0;
  showLoading();
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat===cat));
  try {
    const cacheKey = 'cat:' + cat;
    let allResults = cacheGet(cacheKey);
    if (!allResults) {
      const url  = `${ITUNES}/search?media=podcast&limit=${API_LIMIT}&term=${encodeURIComponent(cat)}`;
      const data = await fetchJSON(url);
      allResults = data.results || [];
      cacheSet(cacheKey, allResults);
    }
    S.allPodcasts = allResults;
    S.podcasts    = S.allPodcasts.slice(0, PAGE_SIZE);
    S.shownCount  = S.podcasts.length;
    const label = CATEGORIES.find(c=>c.id===cat)?.label || cat;
    renderPodcastGrid(S.podcasts, label,
      S.allPodcasts.length, S.shownCount < S.allPodcasts.length);
  } catch(e) {
    showError('Browse failed: ' + e.message);
  }
}

async function fetchFeedDesc(feedUrl) {
  if (!feedUrl) return '';
  try {
    const cacheKey = 'feed:' + feedUrl;
    const cached = cacheGet(cacheKey);
    if (cached !== null) return cached;
    const res  = await fetch(PROXY + encodeURIComponent(feedUrl));
    const text = await res.text();
    // Parse RSS description from feed XML
    const doc  = new DOMParser().parseFromString(text, 'text/xml');
    // Try <itunes:summary>, then <description>, then <subtitle>
    const desc = doc.querySelector('channel > itunes\:summary')?.textContent
              || doc.querySelector('channel > description')?.textContent
              || doc.querySelector('channel > subtitle')?.textContent
              || '';
    const clean = desc.replace(/<[^>]+>/g, '').trim();
    cacheSet(cacheKey, clean);
    return clean;
  } catch { return ''; }
}

async function loadEpisodes(podcast) {
  S.selected = podcast;
  showLoading();
  try {
    const url  = `${ITUNES}/lookup?id=${podcast.collectionId}&media=podcast&entity=podcastEpisode&limit=${MAX_EPS}`;
    // Fetch episodes and feed description in parallel
    // Fetch episodes first so the UI appears quickly, then load feed desc
    const data = await fetchJSON(url);
    const eps  = (data.results || []).filter(r => r.kind === 'podcast-episode' || r.kind === 'podcast-video-episode');
    eps.sort((a, b) => new Date(b.releaseDate) - new Date(a.releaseDate));
    S.episodes = eps;
    S.feedDesc = '';
    renderEpisodeList(podcast, S.episodes);
    // Fetch feed description asynchronously and inject it when ready
    fetchFeedDesc(podcast.feedUrl || '').then(feedDesc => {
      if (!feedDesc) return;
      S.feedDesc = feedDesc;
      const wrap = document.getElementById('showDescWrap');
      if (!wrap) return;
      wrap.innerHTML = `<div class="show-podcast-desc" id="showPodcastDesc">${esc(feedDesc)}</div>`
        + (feedDesc.length > 300
            ? '<button class="show-desc-toggle" onclick="toggleShowDesc()">Show more</button>'
            : '');
    }).catch(() => {});
    // Fetch related shows after rendering episodes (non-blocking)
    fetchRelated(podcast).then(related => {
      if (related.length) renderRelated(related);
    }).catch(() => {});
  } catch(e) {
    showError('Could not load episodes: ' + e.message);
  }
}

async function fetchRelated(podcast) {
  const genre  = podcast.primaryGenreName || (podcast.genres && podcast.genres[0]) || '';
  const artist = podcast.artistName || '';
  const id     = podcast.collectionId;
  const seen   = new Set([id]);
  let related  = [];

  // Parallel searches: by genre and by artist/network
  const queries = [];
  if (genre)  queries.push(`${ITUNES}/search?media=podcast&limit=20&term=${encodeURIComponent(genre)}`);
  if (artist) queries.push(`${ITUNES}/search?media=podcast&limit=10&term=${encodeURIComponent(artist)}`);

  const results = await Promise.allSettled(
    queries.map(u => {
      const key = 'rel:' + u;
      const cached = cacheGet(key);
      if (cached) return Promise.resolve(cached);
      return fetchJSON(u).then(d => { cacheSet(key, d.results||[]); return d.results||[]; });
    })
  );

  for (const r of results) {
    if (r.status === 'fulfilled') {
      for (const p of r.value) {
        if (!seen.has(p.collectionId)) {
          seen.add(p.collectionId);
          related.push(p);
        }
      }
    }
  }
  // Shuffle slightly to vary results, then cap at 8
  related.sort(() => Math.random() - 0.5);
  return related.slice(0, 8);
}

// Append fresh cards to the existing grid without re-rendering everything
function appendPodcastCards(newPodcasts, startIndex) {
  const grid = $('podcastGrid');
  if (!grid) return;
  // Remove existing load-more wrap before appending
  const oldWrap = $('loadMoreWrap');
  if (oldWrap) oldWrap.remove();
  newPodcasts.forEach((p, i) => {
    const idx = startIndex + i;
    const fav = isFav(p.collectionId);
    const art = artImg(p.artworkUrl100 || p.artworkUrl60 || '', 400);
    const div = document.createElement('div');
    div.className = 'podcast-card card-enter';
    div.style.animationDelay = (i * .04) + 's';
    div.dataset.id = p.collectionId;
    div.onclick = () => onPodcastClick(idx);
    div.innerHTML = `
      <img class="pc-art" src="${esc(art)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
      <div class="pc-body">
        <div class="pc-name">${esc(p.collectionName||'')}</div>
        <div class="pc-artist">${esc(p.artistName||'')}</div>
      </div>
      <button class="pc-fav ${fav?'is-fav':''}" data-fav-id="${p.collectionId}"
        title="${fav?'Remove favourite':'Add favourite'}">${fav?'★':'☆'}</button>`;
    // Wire the fav button
    div.querySelector('.pc-fav').addEventListener('click', e => {
      e.stopPropagation();
      toggleFav(window.PODCASTS[idx], e);
    });
    grid.appendChild(div);
  });
  // Update count
  const countEl = $('resultsCount');
  if (countEl) countEl.textContent = window.PODCASTS.length + ' shows';
}

function updateLoadMore(hasMore) {
  // hasMore can be passed explicitly or derived from state
  if (hasMore === undefined) hasMore = S.shownCount < S.allPodcasts.length;
  // Remove any existing load-more
  const old = $('loadMoreWrap');
  if (old) old.remove();
  if (!hasMore) return;
  const grid = $('podcastGrid');
  if (!grid) return;
  const wrap = document.createElement('div');
  wrap.className = 'load-more-wrap';
  wrap.id = 'loadMoreWrap';
  wrap.innerHTML = `<button class="btn-load-more" onclick="loadMore()">
    <div class="spinner"></div>
    <span class="lm-text">Load more shows</span>
  </button>`;
  grid.after(wrap);
}

function setLoadMoreLoading(on) {
  const btn = $('loadMoreWrap')?.querySelector('.btn-load-more');
  if (!btn) return;
  btn.disabled = on;
  btn.classList.toggle('loading', on);
}

// Triggered by Load More button — reveals next PAGE_SIZE from allPodcasts (client-side)
window.loadMore = () => {
  const next = S.allPodcasts.slice(S.shownCount, S.shownCount + PAGE_SIZE);
  if (!next.length) { updateLoadMore(false); return; }
  const startIdx = S.shownCount;
  S.podcasts   = S.allPodcasts.slice(0, S.shownCount + next.length);
  S.shownCount = S.podcasts.length;
  window.PODCASTS = S.podcasts;
  appendPodcastCards(next, startIdx);
  const hasMore = S.shownCount < S.allPodcasts.length;
  updateLoadMore(hasMore);
  // Update count
  const countEl = $('resultsCount');
  if (countEl) countEl.textContent = S.allPodcasts.length + ' shows';
};

function renderEpisodeList(podcast, episodes) {
  S.view = 'episodes';
  const fav = isFav(podcast.collectionId);
  const rows = episodes.map((ep,i) => {
    const title   = strip(ep.trackName) || 'Untitled Episode';
    const desc    = strip(ep.description || ep.shortDescription || '');
    const hasAudio    = !!(ep.episodeUrl || ep.trackViewUrl);
    const isCached    = Offline.isCached(ep.trackId);
    const resumePos   = History.getPosition(ep.trackId);
    const epDur       = ep.trackTimeMillis ? ep.trackTimeMillis / 1000 : 0;
    const listenPct   = (resumePos > 5 && epDur > 0) ? Math.min(100, Math.round(resumePos/epDur*100)) : 0;
    const isVideo  = !!(ep.episodeUrl && /\.(mp4|m4v|mov|webm|avi)(\?|$)/i.test(ep.episodeUrl))
                  || ep.kind === 'podcast-video-episode'
                  || ep.trackType === 'Video';
    const item    = S.queue[S.queueIdx];
    const isPlay  = item && item.ep.trackId === ep.trackId;
    const qi      = S.queue.findIndex((it,idx)=>it.ep.trackId===ep.trackId && idx!==S.queueIdx);
    const isQ     = qi >= 0 && !isPlay;
    const queueLabel  = isQ ? '\u2713' : '+';
    const queueTitle  = isQ ? 'Already in queue' : 'Add to queue';
    const playLabel   = isPlay ? '\u23f8' : '\u25b6';
    const playTitle   = isPlay ? 'Pause' : 'Play';
    return `<div class="ep-item fade-in ${isPlay?'playing':''} ${isQ?'queued':''}"
        style="animation-delay:${i*.015}s" data-tid="${ep.trackId}">
      <div class="ep-num">${i+1}</div>
      <div class="ep-body">
        <div class="ep-title">${esc(title)}</div>
        ${desc ? `<div class="ep-desc">
            <div class="ep-desc-inner" data-epd="${i}">${esc(desc)}</div>
            ${desc.length > 200 ? `<button class="ep-desc-toggle visible" data-epdt="${i}" onclick="event.stopPropagation();toggleEpDesc(${i})">Show more</button>` : ''}
          </div>` : ''}
        <div class="ep-meta">
          ${ep.releaseDate ? `<span class="ep-date">${fmtDate(ep.releaseDate)}</span>` : ''}
          ${ep.trackTimeMillis ? `<span class="ep-dur">${fmtTime(ep.trackTimeMillis/1000)}</span>` : ''}
          ${isVideo ? '<span class="ep-video-badge">\u25b6 VIDEO</span>' : ''}
          ${!hasAudio ? '<span class="ep-dur" style="color:var(--accent)">No audio</span>' : ''}
          ${listenPct > 0 && listenPct < 95 ? `<span class="ep-dur" style="color:var(--text3)">${listenPct}% heard</span>` : ''}
          ${listenPct >= 95 ? '<span class="ep-dur" style="color:var(--playing)">\u2713 Played</span>' : ''}
          ${isCached ? `<span class="ep-offline-badge cached" title="Cached offline" onclick="event.stopPropagation();Offline.remove(${ep.trackId})">\u2193 Offline</span>` : (hasAudio ? `<span class="ep-offline-badge" title="Save for offline" onclick="event.stopPropagation();Offline.download(EPISODES[${i}], S.selected)">\u2193 Save</span>` : '')}
        </div>
      </div>
      <div class="ep-actions">
        <button class="ep-queue-btn ${isQ?'in-queue':''}" data-qi="${i}"
          title="${queueTitle}" ${!hasAudio?'disabled':''}>
          ${queueLabel}
        </button>
        <div class="ep-play-indicator" data-pi="${i}" title="${playTitle}"
          style="cursor:pointer">${playLabel}</div>
      </div>
    </div>`;
  }).join('');

  $('mainInner').innerHTML = `
    <div class="ep-list-header fade-in">
      <button class="btn-back" onclick="goBack()">← Back</button>
    </div>
    <div class="show-meta fade-in">
      <img class="show-art" src="${artImg(podcast.artworkUrl100||podcast.artworkUrl60||'', 400)}" alt="" onerror="this.style.visibility='hidden'">
      <div class="show-info">
        <div class="show-name">${esc(podcast.collectionName||'')}</div>
        <div class="show-artist">${esc(podcast.artistName||'')}</div>
        <div id="showDescWrap"></div>
        <div class="show-actions">
          <button class="btn-sm ${fav?'is-fav':''}" data-fav-id="${podcast.collectionId}"
            onclick="toggleFav(S.selected,event)">${fav?'★ Saved':'☆ Save'}</button>
        </div>
      </div>
    </div>
    <div class="ep-count fade-in">${episodes.length} episode${episodes.length!==1?'s':''}</div>
    ${rows || '<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">No episodes found</div></div>'}`;

  window.EPISODES = episodes;
  // Play button handler
  const onPlayClick = (i) => {
    const ep   = EPISODES[i];
    const show = S.selected;
    const currentItem = S.queue[S.queueIdx];
    if (currentItem && currentItem.ep.trackId === ep.trackId) {
      audio.paused ? audio.play().catch(()=>{}) : audio.pause();
    } else if (!S.queue.length || S.queueIdx < 0) {
      S.queue    = [{ep, show}];
      S.queueIdx = 0;
      playQueue(0);
      toast('\u25b6 ' + (strip(ep.trackName)||'').substring(0,36));
    } else {
      const dup = S.queue.findIndex(it => it.ep.trackId === ep.trackId);
      if (dup >= 0) S.queue.splice(dup, 1);
      const insertAt = S.queueIdx + 1;
      S.queue.splice(insertAt, 0, {ep, show});
      S.queueIdx = insertAt;
      playQueue(S.queueIdx);
      toast('\u25b6 ' + (strip(ep.trackName)||'').substring(0,36));
    }
    saveQueue();
    updateQueueUI();
    updateEpHighlights();
  };

  // Queue button handler — adds to end of queue without interrupting playback
  const onQueueClick = (i) => {
    const ep   = EPISODES[i];
    const show = S.selected;
    const already = S.queue.findIndex(it => it.ep.trackId === ep.trackId);

    if (already >= 0) {
      // ✓ clicked — remove from queue (unless it's currently playing)
      if (already === S.queueIdx) {
        toast('Cannot remove currently playing episode');
        return;
      }
      S.queue.splice(already, 1);
      // Adjust queueIdx if we removed something before the current position
      if (already < S.queueIdx) S.queueIdx--;
      toast('Removed from queue');
      saveQueue();
      updateQueueUI();
      updateEpHighlights();
      return;
    }

    if (!S.queue.length || S.queueIdx < 0) {
      // Nothing playing — start immediately
      S.queue    = [{ep, show}];
      S.queueIdx = 0;
      playQueue(0);
      toast('\u25b6 ' + (strip(ep.trackName)||'').substring(0,36));
    } else {
      // Add to end of queue (check for duplicates one final time)
      if (S.queue.some(it => it.ep.trackId === ep.trackId)) {
        toast('Already in queue'); return;
      }
      S.queue.push({ep, show});
      toast('+ Queued: ' + (strip(ep.trackName)||'').substring(0,36));
    }
    saveQueue();
    updateQueueUI();
    updateEpHighlights();
  };

  // Expose handlers for the global delegation listener
  window._onPlayClick  = onPlayClick;
  window._onQueueClick = onQueueClick;
}
