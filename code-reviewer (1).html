<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Code Reviewer</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0b0b0f;
    --surface: #13131a;
    --surface2: #1a1a24;
    --surface3: #20202e;
    --border: #252535;
    --border2: #2e2e42;
    --accent: #7c6dfa;
    --accent2: #a78bfa;
    --accent3: #c4b5fd;
    --green: #34d399;
    --red: #f87171;
    --amber: #fbbf24;
    --blue: #60a5fa;
    --text: #e2e2f0;
    --text2: #9999bb;
    --text3: #55556a;
    --mono: 'Space Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.6;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 20px;
    height: 54px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    position: relative;
  }

  .logo-mark {
    width: 34px; height: 34px;
    background: linear-gradient(135deg, #7c6dfa 0%, #a78bfa 100%);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 13px; font-weight: 700;
    color: #fff; flex-shrink: 0;
  }

  .header-text h1 {
    font-size: 14px; font-weight: 500; letter-spacing: -0.01em;
    color: var(--text);
  }
  .header-text p {
    font-size: 11px; color: var(--text3); font-family: var(--mono);
  }

  .live-badge {
    margin-left: auto;
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; font-family: var(--mono);
    color: var(--green);
    background: rgba(52, 211, 153, 0.08);
    border: 1px solid rgba(52, 211, 153, 0.2);
    padding: 4px 10px; border-radius: 20px;
  }
  .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--green);
    animation: blink 2s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* ── MAIN LAYOUT ── */
  .workspace {
    display: grid;
    grid-template-columns: 1fr 1fr;
    flex: 1;
    overflow: hidden;
  }

  /* ── PANES ── */
  .pane {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-right: 1px solid var(--border);
  }
  .pane:last-child { border-right: none; }

  .pane-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 14px;
    height: 40px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .pane-label {
    font-size: 10px; font-family: var(--mono);
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--text3);
  }

  .lang-pill {
    font-size: 10px; font-family: var(--mono);
    padding: 2px 8px; border-radius: 4px;
    background: rgba(124,109,250,0.12);
    color: var(--accent3);
    border: 1px solid rgba(124,109,250,0.2);
  }

  .upload-btn {
    margin-left: auto;
    font-size: 11px; font-family: var(--mono);
    color: var(--text3);
    background: var(--surface2);
    border: 1px dashed var(--border2);
    padding: 4px 10px; border-radius: 5px;
    cursor: pointer; transition: all 0.15s;
  }
  .upload-btn:hover { color: var(--accent2); border-color: var(--accent); }
  #fileInput { display: none; }

  /* ── CODE EDITOR ── */
  #codeInput {
    flex: 1;
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: none; outline: none;
    resize: none;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.75;
    padding: 16px;
    tab-size: 2;
    caret-color: var(--accent2);
  }
  #codeInput::placeholder { color: var(--text3); line-height: 2; }

  /* ── BOTTOM TOOLBAR ── */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .btn {
    font-family: var(--sans); font-size: 13px; font-weight: 500;
    padding: 7px 18px; border-radius: 6px;
    border: none; cursor: pointer; transition: all 0.15s;
    letter-spacing: -0.01em;
  }
  .btn-primary {
    background: var(--accent); color: #fff;
  }
  .btn-primary:hover { background: var(--accent2); transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

  .btn-ghost {
    background: transparent; color: var(--text3);
    border: 1px solid var(--border2);
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--text3); }

  .char-counter {
    margin-left: auto;
    font-size: 11px; font-family: var(--mono);
    color: var(--text3);
  }

  /* ── OUTPUT PANE ── */
  .output-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    background: var(--bg);
  }
  .output-scroll::-webkit-scrollbar { width: 4px; }
  .output-scroll::-webkit-scrollbar-track { background: transparent; }
  .output-scroll::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  /* ── PLACEHOLDER ── */
  .placeholder {
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px; text-align: center;
    color: var(--text3);
  }
  .placeholder-glyph {
    font-family: var(--mono); font-size: 36px;
    opacity: 0.2; margin-bottom: 4px;
  }
  .placeholder p { font-size: 13px; line-height: 1.6; }
  .placeholder strong { color: var(--text2); font-weight: 500; }

  /* ── THINKING STATE ── */
  .thinking {
    display: flex; align-items: center; gap: 10px;
    color: var(--accent2); font-family: var(--mono); font-size: 12px;
    padding: 4px 0 16px;
  }
  .dots { display: flex; gap: 4px; }
  .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent);
    animation: bounce 1.2s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.15s; }
  .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%,80%,100% { transform: translateY(0); opacity: 0.3; }
    40% { transform: translateY(-5px); opacity: 1; }
  }

  /* ── SCORE CARD ── */
  .score-card {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 16px;
    background: var(--surface2);
    border-radius: 10px;
    border: 1px solid var(--border);
    margin-bottom: 14px;
    animation: fadeUp 0.3s ease;
  }
  @keyframes fadeUp {
    from { opacity:0; transform: translateY(8px); }
    to { opacity:1; transform: translateY(0); }
  }

  .score-num {
    font-family: var(--mono); font-size: 36px; font-weight: 700;
    line-height: 1; flex-shrink: 0;
  }
  .score-num.good { color: var(--green); }
  .score-num.mid  { color: var(--amber); }
  .score-num.bad  { color: var(--red); }

  .score-right { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .score-meta { display: flex; justify-content: space-between; align-items: center; }
  .score-meta-label { font-size: 11px; color: var(--text3); }
  .score-lang {
    font-size: 10px; font-family: var(--mono);
    padding: 2px 7px; border-radius: 4px;
    background: var(--surface3); color: var(--accent3);
    border: 1px solid var(--border2);
  }

  .track {
    height: 5px; background: var(--border2); border-radius: 3px;
    overflow: hidden;
  }
  .fill {
    height: 100%; border-radius: 3px;
    transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .fill.good { background: var(--green); }
  .fill.mid  { background: var(--amber); }
  .fill.bad  { background: var(--red); }

  /* ── SUMMARY ── */
  .summary {
    font-size: 13px; line-height: 1.7;
    color: var(--text2);
    padding: 12px 14px;
    background: var(--surface2);
    border-radius: 8px;
    border-left: 3px solid var(--accent);
    margin-bottom: 16px;
    animation: fadeUp 0.3s ease 0.05s both;
  }

  /* ── SECTION ── */
  .section { margin-bottom: 16px; animation: fadeUp 0.3s ease 0.1s both; }
  .section-title {
    font-size: 10px; font-family: var(--mono);
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--text3);
    padding-bottom: 8px; margin-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  /* ── ISSUE CARD ── */
  .issue {
    display: flex; gap: 10px;
    padding: 10px 12px;
    border-radius: 7px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-left: 3px solid transparent;
    margin-bottom: 8px;
    transition: border-color 0.15s;
  }
  .issue:hover { border-color: var(--border2); border-left-color: inherit; }
  .issue.critical  { border-left-color: var(--red); }
  .issue.warning   { border-left-color: var(--amber); }
  .issue.suggestion{ border-left-color: var(--accent); }
  .issue.positive  { border-left-color: var(--green); }

  .issue-icon {
    font-size: 13px; flex-shrink: 0; margin-top: 2px;
    font-family: var(--mono);
  }
  .issue.critical  .issue-icon { color: var(--red); }
  .issue.warning   .issue-icon { color: var(--amber); }
  .issue.suggestion .issue-icon { color: var(--accent2); }
  .issue.positive  .issue-icon { color: var(--green); }

  .issue-body { flex: 1; }
  .issue-meta {
    font-size: 10px; font-family: var(--mono);
    color: var(--text3); margin-bottom: 3px;
    display: flex; gap: 6px; align-items: center;
  }
  .issue-type { font-weight: 700; }
  .issue.critical  .issue-type { color: var(--red); }
  .issue.warning   .issue-type { color: var(--amber); }
  .issue.suggestion .issue-type { color: var(--accent2); }
  .issue.positive  .issue-type { color: var(--green); }

  .issue-text { font-size: 13px; color: var(--text); line-height: 1.55; }

  /* ── ERROR ── */
  .error-box {
    padding: 12px 14px;
    background: rgba(248,113,113,0.08);
    border: 1px solid rgba(248,113,113,0.25);
    border-radius: 8px;
    color: var(--red);
    font-size: 13px; font-family: var(--mono);
  }
</style>
</head>
<body>

<header>
  <div class="logo-mark">&lt;/&gt;</div>
  <div class="header-text">
    <h1>AI Code Reviewer</h1>
    <p>claude-sonnet · instant feedback</p>
  </div>
  <div class="live-badge">
    <div class="live-dot"></div>
    connected
  </div>
</header>

<div class="workspace">

  <!-- LEFT: Code Input -->
  <div class="pane">
    <div class="pane-bar">
      <span class="pane-label">Code Input</span>
      <span class="lang-pill" id="langPill">auto-detect</span>
      <label class="upload-btn" for="fileInput">+ upload file</label>
      <input type="file" id="fileInput" accept=".js,.ts,.jsx,.tsx,.py,.java,.cpp,.c,.cs,.go,.rb,.php,.html,.css,.rs,.swift,.kt,.vue,.json,.sh">
    </div>

    <textarea id="codeInput" spellcheck="false"
      placeholder="Paste your code here or upload a file...&#10;&#10;Supports: JavaScript · TypeScript · Python · Java&#10;C / C++ · C# · Go · Rust · Swift · Kotlin&#10;Ruby · PHP · HTML · CSS · and more"></textarea>

    <div class="toolbar">
      <button class="btn btn-primary" id="reviewBtn" onclick="reviewCode()">Review Code ↗</button>
      <button class="btn btn-ghost" onclick="clearAll()">Clear</button>
      <span class="char-counter" id="charCount">0 chars</span>
    </div>
  </div>

  <!-- RIGHT: AI Output -->
  <div class="pane">
    <div class="pane-bar">
      <span class="pane-label">AI Review</span>
    </div>
    <div class="output-scroll" id="output">
      <div class="placeholder">
        <div class="placeholder-glyph">◈</div>
        <p>Paste your code on the left<br>then hit <strong>Review Code</strong></p>
      </div>
    </div>
  </div>

</div>

<script>
const codeInput   = document.getElementById('codeInput');
const output      = document.getElementById('output');
const reviewBtn   = document.getElementById('reviewBtn');
const langPill    = document.getElementById('langPill');
const charCount   = document.getElementById('charCount');
const fileInput   = document.getElementById('fileInput');

// ── Language detection
function detectLang(code) {
  if (/^\s*<(!DOCTYPE|html)/i.test(code))       return 'HTML';
  if (/def |import \w|print\(|:\s*\n/.test(code)) return 'Python';
  if (/\bfn \w|\blet mut\b|use std::/.test(code)) return 'Rust';
  if (/func \w+\(|package main/.test(code))       return 'Go';
  if (/#include\s*<|std::/.test(code))            return 'C++';
  if (/public\s+class\b|System\.out\./.test(code)) return 'Java';
  if (/using System|namespace \w/.test(code))      return 'C#';
  if (/func\s+\w+.*->|@IBOutlet/.test(code))       return 'Swift';
  if (/fun \w+\(|val |var /.test(code) && /kotlin/i.test(code)) return 'Kotlin';
  if (/<\?php/.test(code))                         return 'PHP';
  if (/require\s+['"]|def \w+.*end/.test(code))    return 'Ruby';
  if (/:\s*[\w\[\]|?]+;|interface \w/.test(code) && /tsx?/.test('ts')) return 'TypeScript';
  if (/const |let |var |=>|console\./.test(code))  return 'JavaScript';
  if (/\{[\s\S]*:\s*[\w#"']/.test(code) && !/{/.test(code.replace(/\{[^}]*\}/g,''))) return 'CSS';
  return 'Code';
}

codeInput.addEventListener('input', () => {
  const v = codeInput.value;
  charCount.textContent = v.length.toLocaleString() + ' chars';
  langPill.textContent = v.trim() ? detectLang(v) : 'auto-detect';
});

// ── File upload
fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    codeInput.value = ev.target.result;
    charCount.textContent = ev.target.result.length.toLocaleString() + ' chars';
    langPill.textContent = detectLang(ev.target.result);
  };
  reader.readAsText(file);
  e.target.value = '';
});

// ── Clear
function clearAll() {
  codeInput.value = '';
  charCount.textContent = '0 chars';
  langPill.textContent = 'auto-detect';
  showPlaceholder();
}

function showPlaceholder() {
  output.innerHTML = `<div class="placeholder">
    <div class="placeholder-glyph">◈</div>
    <p>Paste your code on the left<br>then hit <strong>Review Code</strong></p>
  </div>`;
}

// ── Review
async function reviewCode() {
  const code = codeInput.value.trim();
  if (!code) { codeInput.focus(); return; }

  reviewBtn.disabled = true;
  reviewBtn.textContent = 'Reviewing...';

  output.innerHTML = `<div class="thinking">
    <div class="dots">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <span>Claude is reading your code…</span>
  </div>`;

  const lang = detectLang(code);

  const prompt = `You are a senior software engineer performing a code review. Analyze the code below and respond ONLY with a valid JSON object — no markdown, no backticks, no commentary outside the JSON.

Return exactly this structure:
{
  "score": <integer 0-100>,
  "language": "<detected language>",
  "summary": "<2-3 sentences: overall quality, main strengths and concerns>",
  "issues": [
    {
      "type": "critical|warning|suggestion|positive",
      "line": "<line number, range, or 'general'>",
      "text": "<specific, actionable explanation>"
    }
  ]
}

Rules:
- score 0-100 reflects overall code quality
- Include 3-6 issues mixing all types
- Be specific: reference actual variable names, line numbers, patterns from the code
- For positives, highlight genuinely good practices found
- For criticals, explain the real risk or bug

Code to review (${lang}):
${code.slice(0, 5000)}`;

  try {
    const proxyUrl = 'https://proxy.killcors.com?url=' + encodeURIComponent('https://api.anthropic.com/v1/messages');

    const res = await fetch(proxyUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    const data = await res.json();
    if (!data?.content?.[0]?.text) throw new Error(data?.error?.message || 'Empty response');

    let raw = data.content[0].text.trim().replace(/```json|```/g, '').trim();
    const review = JSON.parse(raw);
    renderReview(review);

  } catch (err) {
    output.innerHTML = `<div class="error-box">✗ ${err.message}</div>`;
  }

  reviewBtn.disabled = false;
  reviewBtn.textContent = 'Review Code ↗';
}

// ── Render
function renderReview(r) {
  const score = Math.max(0, Math.min(100, r.score || 0));
  const cls   = score >= 75 ? 'good' : score >= 45 ? 'mid' : 'bad';

  const icons = { critical: '✗', warning: '⚠', suggestion: '→', positive: '✓' };
  const labels = { critical: 'CRITICAL', warning: 'WARNING', suggestion: 'SUGGESTION', positive: 'POSITIVE' };

  const issuesHtml = (r.issues || []).map(i => `
    <div class="issue ${i.type}">
      <div class="issue-icon">${icons[i.type] || '·'}</div>
      <div class="issue-body">
        <div class="issue-meta">
          <span class="issue-type">${labels[i.type] || i.type.toUpperCase()}</span>
          <span>·</span>
          <span>${i.line || 'general'}</span>
        </div>
        <div class="issue-text">${i.text}</div>
      </div>
    </div>`).join('');

  output.innerHTML = `
    <div class="score-card">
      <div class="score-num ${cls}">${score}</div>
      <div class="score-right">
        <div class="score-meta">
          <span class="score-meta-label">quality score / 100</span>
          <span class="score-lang">${r.language || lang}</span>
        </div>
        <div class="track">
          <div class="fill ${cls}" style="width:0%" id="scoreFill"></div>
        </div>
      </div>
    </div>

    <div class="summary">${r.summary || ''}</div>

    <div class="section">
      <div class="section-title">Findings · ${(r.issues||[]).length} items</div>
      ${issuesHtml}
    </div>`;

  setTimeout(() => {
    const fill = document.getElementById('scoreFill');
    if (fill) fill.style.width = score + '%';
  }, 50);
}

// Enter to submit (Ctrl/Cmd + Enter)
codeInput.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') reviewCode();
});
</script>
</body>
</html>
