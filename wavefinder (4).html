<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WAVEFINDER — Podcast Discovery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── RESET ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button{cursor:pointer;font:inherit;border:none;background:none}
input{font:inherit;border:none;outline:none;background:none}
img{display:block}
a{color:inherit;text-decoration:none}
ul{list-style:none}

/* ── TOKENS ── */
:root{
  --sans: 'DM Sans', sans-serif;
  --serif: 'DM Serif Display', Georgia, serif;
  --mono: 'JetBrains Mono', monospace;
  --ease: cubic-bezier(.25,.46,.45,.94);
  --ease-spring: cubic-bezier(.34,1.56,.64,1);

  /* Light */
  --bg:       #f7f5f0;
  --bg2:      #eeebe3;
  --bg3:      #e4e0d6;
  --surface:  #ffffff;
  --border:   #d8d4ca;
  --border2:  #c8c3b8;
  --text:     #1a1814;
  --text2:    #5a5650;
  --text3:    #8a8680;
  --accent:   #c8440c;
  --accent2:  #e05a20;
  --accentBg: rgba(200,68,12,.08);
  --accentBg2:rgba(200,68,12,.15);
  --playing:  #0d7e3c;
  --playingBg:rgba(13,126,60,.08);
  --wave1:    #c8440c;
  --wave2:    #e8a030;
  --shadow:   0 1px 3px rgba(26,24,20,.08), 0 4px 16px rgba(26,24,20,.06);
  --shadow2:  0 2px 8px rgba(26,24,20,.12), 0 8px 32px rgba(26,24,20,.08);
}

[data-theme="dark"]{
  --bg:       #111009;
  --bg2:      #1a1814;
  --bg3:      #222018;
  --surface:  #1e1c14;
  --border:   #2e2c22;
  --border2:  #3e3c30;
  --text:     #f0ece2;
  --text2:    #a09c90;
  --text3:    #60594e;
  --accent:   #e8622a;
  --accent2:  #ff8050;
  --accentBg: rgba(232,98,42,.1);
  --accentBg2:rgba(232,98,42,.2);
  --playing:  #22c55e;
  --playingBg:rgba(34,197,94,.1);
  --shadow:   0 1px 3px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.2);
  --shadow2:  0 2px 8px rgba(0,0,0,.4), 0 8px 32px rgba(0,0,0,.3);
}

/* ── BASE ── */
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}

/* ── LAYOUT ── */
.layout{display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:280px 1fr;
  height:100vh;overflow:hidden}
.header{grid-column:1/-1;grid-row:1;border-bottom:1px solid var(--border);
  background:var(--surface);display:flex;align-items:center;gap:16px;
  padding:0 20px;height:60px;z-index:100;box-shadow:var(--shadow)}
.sidebar{grid-column:1;grid-row:2;border-right:1px solid var(--border);
  background:var(--bg2);overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column}
.main{grid-column:2;grid-row:2;overflow-y:auto;overflow-x:hidden}
.player-bar{grid-column:1/-1;grid-row:3;border-top:1px solid var(--border);
  background:var(--surface);z-index:100;box-shadow:0 -2px 12px rgba(0,0,0,.06)}

/* ── HEADER ── */
.logo{font-family:var(--serif);font-size:20px;color:var(--accent);
  letter-spacing:-.3px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.logo-wave{display:flex;align-items:flex-end;gap:2px;height:18px}
.logo-wave span{width:3px;border-radius:3px;background:var(--accent);
  animation:logowave 1.2s ease-in-out infinite;transform-origin:bottom}
.logo-wave span:nth-child(1){height:8px;animation-delay:0s}
.logo-wave span:nth-child(2){height:14px;animation-delay:.1s}
.logo-wave span:nth-child(3){height:10px;animation-delay:.2s}
.logo-wave span:nth-child(4){height:16px;animation-delay:.3s}
.logo-wave span:nth-child(5){height:6px;animation-delay:.4s}
@keyframes logowave{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.5)}}

.search-form{flex:1;max-width:480px;display:flex;align-items:center;
  background:var(--bg2);border:1px solid var(--border);border-radius:10px;
  padding:0 14px;gap:10px;transition:border-color .15s,box-shadow .15s}
.search-form:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentBg)}
.search-form svg{flex-shrink:0;opacity:.4}
.search-form input{flex:1;padding:10px 0;font-size:13px;color:var(--text);
  background:transparent}
.search-form input::placeholder{color:var(--text3)}
.btn-search{padding:6px 14px;background:var(--accent);color:#fff;border-radius:7px;
  font-size:12px;font-weight:600;letter-spacing:.3px;transition:background .15s,transform .1s}
.btn-search:hover{background:var(--accent2)}
.btn-search:active{transform:scale(.96)}

.header-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.btn-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;color:var(--text2);transition:background .15s,color .15s}
.btn-icon:hover{background:var(--bg2);color:var(--text)}
.btn-icon svg{width:18px;height:18px}
.badge{position:absolute;top:4px;right:4px;width:8px;height:8px;
  border-radius:50%;background:var(--accent);border:2px solid var(--surface)}

/* ── SIDEBAR ── */
.sidebar-section{padding:16px 14px 8px}
.sidebar-label{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text3);margin-bottom:8px}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cat-btn{padding:8px 10px;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;font-size:11px;font-weight:500;color:var(--text2);
  text-align:left;transition:all .15s;display:flex;align-items:center;gap:6px}
.cat-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accentBg)}
.cat-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accentBg)}
.cat-icon{font-size:14px}

.favorites-list{display:flex;flex-direction:column;gap:2px}
.fav-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;
  cursor:pointer;transition:background .15s}
.fav-item:hover{background:var(--bg3)}
.fav-item.active{background:var(--accentBg)}
.fav-thumb{width:32px;height:32px;border-radius:6px;object-fit:cover;flex-shrink:0;
  background:var(--bg3)}
.fav-name{font-size:12px;font-weight:500;color:var(--text);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.fav-remove{margin-left:auto;opacity:0;color:var(--text3);font-size:11px;
  padding:2px 4px;border-radius:4px;flex-shrink:0;transition:opacity .15s,color .15s}
.fav-item:hover .fav-remove{opacity:1}
.fav-remove:hover{color:var(--accent)}
.empty-favs{padding:16px;text-align:center;color:var(--text3);font-size:12px;
  font-style:italic;line-height:1.8}

/* ── MAIN AREA ── */
.main-inner{padding:24px}
.results-header{display:flex;align-items:baseline;gap:12px;margin-bottom:20px}
.results-title{font-family:var(--serif);font-size:24px;font-weight:400;color:var(--text)}
.results-count{font-size:12px;color:var(--text3);font-family:var(--mono)}

/* Podcast grid */
.podcast-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.podcast-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  overflow:hidden;cursor:pointer;transition:transform .2s var(--ease),
  box-shadow .2s var(--ease),border-color .2s;position:relative}
.podcast-card:hover{transform:translateY(-3px);box-shadow:var(--shadow2);border-color:var(--border2)}
.podcast-card.selected{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentBg)}
.pc-art{width:100%;aspect-ratio:1;object-fit:cover;background:var(--bg3)}
.pc-body{padding:12px}
.pc-name{font-size:12px;font-weight:600;color:var(--text);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  margin-bottom:4px}
.pc-artist{font-size:11px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-fav{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;
  background:rgba(255,255,255,.9);backdrop-filter:blur(4px);display:flex;align-items:center;
  justify-content:center;font-size:13px;opacity:0;transition:opacity .15s,transform .15s}
.podcast-card:hover .pc-fav,.pc-fav.is-fav{opacity:1}
.pc-fav:hover{transform:scale(1.15)}
.pc-fav.is-fav{background:var(--accent);color:#fff}

/* Episode list */
.ep-list-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.btn-back{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  color:var(--accent);padding:6px 12px;border:1px solid var(--accentBg2);border-radius:8px;
  background:var(--accentBg);transition:all .15s}
.btn-back:hover{background:var(--accentBg2)}
.show-meta{display:flex;align-items:center;gap:16px;
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:16px;margin-bottom:20px}
.show-art{width:80px;height:80px;border-radius:12px;object-fit:cover;flex-shrink:0;background:var(--bg3)}
.show-info{flex:1;min-width:0}
.show-name{font-family:var(--serif);font-size:20px;margin-bottom:4px}
.show-artist{font-size:12px;color:var(--text2);margin-bottom:6px}
.show-desc{font-size:12px;color:var(--text3);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.show-actions{display:flex;gap:8px;margin-top:10px}
.btn-sm{padding:5px 12px;border-radius:7px;font-size:11px;font-weight:600;
  border:1px solid var(--border);color:var(--text2);background:var(--bg2);
  transition:all .15s}
.btn-sm:hover{border-color:var(--accent);color:var(--accent);background:var(--accentBg)}
.btn-sm.is-fav{border-color:var(--accent);color:var(--accent);background:var(--accentBg)}

.ep-count{font-size:11px;color:var(--text3);font-family:var(--mono);margin-bottom:12px}
.ep-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:14px;margin-bottom:8px;cursor:pointer;transition:all .15s;
  display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start}
.ep-item:hover{border-color:var(--border2);box-shadow:var(--shadow)}
.ep-item.playing{border-color:var(--playing);background:var(--playingBg)}
.ep-item.queued{border-color:var(--border2);background:var(--bg2)}
.ep-num{font-family:var(--mono);font-size:10px;color:var(--text3);
  padding-top:2px;min-width:24px;text-align:right}
.ep-body{min-width:0}
.ep-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep-desc{font-size:11px;color:var(--text3);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep-meta{display:flex;align-items:center;gap:8px;margin-top:6px}
.ep-date{font-size:10px;color:var(--text3);font-family:var(--mono)}
.ep-dur{font-size:10px;color:var(--text3);font-family:var(--mono);
  background:var(--bg2);padding:2px 6px;border-radius:4px}
.ep-play-indicator{display:flex;align-items:center;justify-content:center;
  width:32px;height:32px;border-radius:50%;flex-shrink:0;margin-top:2px;
  background:var(--bg2);border:1px solid var(--border);color:var(--text2);
  transition:all .15s;font-size:12px}
.ep-item:hover .ep-play-indicator{background:var(--accent);border-color:var(--accent);color:#fff}
.ep-item.playing .ep-play-indicator{background:var(--playing);border-color:var(--playing);color:#fff}
.ep-item.queued .ep-play-indicator{background:var(--bg3);color:var(--accent)}
.queue-badge{position:absolute;top:-4px;right:-4px;background:var(--accent);color:#fff;
  border-radius:50%;width:14px;height:14px;font-size:8px;display:flex;
  align-items:center;justify-content:center;font-family:var(--mono)}

/* ── PLAYER BAR ── */
.player-bar{padding:0 20px;height:80px;display:flex;align-items:center;gap:16px}
.player-art{width:48px;height:48px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--bg3)}
.player-info{flex:0 0 200px;min-width:0}
.player-title{font-size:12px;font-weight:600;color:var(--text);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px}
.player-show{font-size:11px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player-center{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
.player-controls{display:flex;align-items:center;gap:8px}
.btn-ctrl{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;color:var(--text2);transition:all .15s;font-size:13px}
.btn-ctrl:hover{background:var(--bg2);color:var(--text);transform:scale(1.08)}
.btn-ctrl.skip{font-family:var(--mono);font-size:9px;font-weight:700;position:relative}
.btn-ctrl.skip span{position:absolute;font-size:7px;bottom:-1px}
.btn-play-main{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:16px;
  transition:all .15s;flex-shrink:0;box-shadow:0 2px 8px var(--accentBg2)}
.btn-play-main:hover{background:var(--accent2);transform:scale(1.06)}
.btn-play-main:active{transform:scale(.96)}
.player-progress{width:100%;display:flex;align-items:center;gap:8px}
.player-time{font-family:var(--mono);font-size:10px;color:var(--text3);min-width:36px;text-align:center}
.progress-track{flex:1;height:4px;background:var(--bg3);border-radius:2px;cursor:pointer;
  position:relative;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;
  transition:width .25s linear;max-width:100%}
.progress-track:hover .progress-fill{background:var(--accent2)}
.player-right{flex:0 0 160px;display:flex;align-items:center;gap:8px;justify-content:flex-end}
.vol-wrap{display:flex;align-items:center;gap:6px;flex:1}
.vol-slider{-webkit-appearance:none;appearance:none;width:80px;height:3px;border-radius:2px;
  background:var(--bg3);outline:none;cursor:pointer}
.vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;
  border-radius:50%;background:var(--accent);cursor:pointer}
.queue-count{font-family:var(--mono);font-size:10px;color:var(--text3);
  background:var(--bg2);padding:3px 8px;border-radius:10px;white-space:nowrap}

/* ── QUEUE PANEL ── */
.queue-panel{position:fixed;right:0;top:60px;bottom:80px;width:320px;
  background:var(--surface);border-left:1px solid var(--border);
  box-shadow:var(--shadow2);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .25s var(--ease);z-index:200}
.queue-panel.open{transform:none}
.queue-header{padding:16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between}
.queue-header h3{font-size:14px;font-weight:600}
.queue-list{flex:1;overflow-y:auto;padding:8px}
.queue-ep{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;
  cursor:pointer;transition:background .15s;position:relative}
.queue-ep:hover{background:var(--bg2)}
.queue-ep.now{background:var(--playingBg)}
.queue-ep-art{width:40px;height:40px;border-radius:6px;object-fit:cover;flex-shrink:0;background:var(--bg3)}
.queue-ep-info{flex:1;min-width:0}
.queue-ep-title{font-size:11px;font-weight:600;color:var(--text);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.queue-ep-show{font-size:10px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.queue-ep-remove{color:var(--text3);font-size:14px;padding:4px;border-radius:4px;
  flex-shrink:0;opacity:0;transition:opacity .15s}
.queue-ep:hover .queue-ep-remove{opacity:1}

/* ── STATES ── */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px;gap:16px;color:var(--text3)}
.spinner{width:32px;height:32px;border:3px solid var(--bg3);
  border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:80px 40px;gap:12px;color:var(--text3);text-align:center}
.empty-icon{font-size:40px;opacity:.3}
.empty-text{font-size:14px;font-weight:500;color:var(--text2)}
.empty-sub{font-size:12px;line-height:1.7}
.load-more-wrap{display:flex;justify-content:center;padding:28px 0 8px;grid-column:1/-1}
.btn-load-more{padding:11px 32px;border:2px solid var(--border2);border-radius:40px;
  font-size:13px;font-weight:600;color:var(--text2);background:var(--surface);
  transition:all .2s var(--ease);letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.btn-load-more:hover{border-color:var(--accent);color:var(--accent);
  background:var(--accentBg);transform:translateY(-1px);box-shadow:var(--shadow)}
.btn-load-more:active{transform:none}
.btn-load-more:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-load-more .spinner{width:14px;height:14px;border-width:2px;display:none}
.btn-load-more.loading .spinner{display:block}
.btn-load-more.loading .lm-text{display:none}

.error-msg{background:rgba(200,68,12,.08);border:1px solid rgba(200,68,12,.2);
  border-radius:10px;padding:14px;color:var(--accent);font-size:12px;
  display:flex;align-items:center;gap:10px}

/* ── TOAST ── */
.toast-wrap{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);
  z-index:999;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--text);color:var(--bg);padding:8px 16px;border-radius:20px;
  font-size:12px;font-weight:500;animation:toastin .25s var(--ease-spring);white-space:nowrap}
@keyframes toastin{from{opacity:0;transform:translateY(12px) scale(.9)}to{opacity:1;transform:none}}

/* ── SCROLLBARS ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  .layout{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto}
  .sidebar{grid-column:1;grid-row:2;max-height:200px;overflow-y:auto;
    flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border)}
  .main{grid-column:1;grid-row:3}
  .player-info{flex:0 0 120px}
  .player-right{flex:0 0 80px}
}

/* ── ANIMATIONS ── */
.fade-in{animation:fadein .25s var(--ease) both}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card-enter{animation:cardenter .3s var(--ease-spring) both}
@keyframes cardenter{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="layout" id="app">

  <!-- HEADER -->
  <header class="header">
    <div class="logo">
      <div class="logo-wave">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      WAVEFINDER
    </div>
    <form class="search-form" id="searchForm">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Search podcasts by name…" autocomplete="off">
      <button class="btn-search" type="submit">Search</button>
    </form>
    <div class="header-actions">
      <button class="btn-icon" id="btnQueue" title="Queue" style="position:relative">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/>
          <line x1="8" y1="18" x2="21" y2="18"/>
          <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/>
          <line x1="3" y1="18" x2="3.01" y2="18"/>
        </svg>
        <span class="badge" id="queueBadge" style="display:none"></span>
      </button>

<!-- TOAST -->
<div class="toast-wrap" id="toastWrap"></div>

<!-- AUDIO -->
<audio id="audioEl" preload="none"></audio>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════════
const PROXY   = 'https://proxy.killcors.com/?url=';
const ITUNES  = 'https://itunes.apple.com';
const MAX_EPS = 100;
const LS_FAV  = 'wavefinder_favs';
const LS_Q    = 'wavefinder_queue';
const LS_NOW  = 'wavefinder_now';
const LS_POS  = 'wavefinder_pos';
const LS_THEME= 'wavefinder_theme';

const CATEGORIES = [
  {id:'comedy',       label:'Comedy',       icon:'😂'},
  {id:'news',         label:'News',         icon:'📰'},
  {id:'science',      label:'Science',      icon:'🔬'},
  {id:'technology',   label:'Technology',   icon:'💻'},
  {id:'history',      label:'History',      icon:'🏛'},
  {id:'true+crime',   label:'True Crime',   icon:'🔍'},
  {id:'business',     label:'Business',     icon:'📈'},
  {id:'health',       label:'Health',       icon:'🧠'},
  {id:'arts',         label:'Arts',         icon:'🎨'},
  {id:'sports',       label:'Sports',       icon:'🏃'},
  {id:'education',    label:'Education',    icon:'📚'},
  {id:'society',      label:'Society',      icon:'🌍'},
];

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
const S = {
  view:      'home',   // 'home' | 'episodes'
  podcasts:  [],
  episodes:  [],
  selected:  null,     // selected podcast object
  queue:     [],       // [{ep, show}]
  queueIdx:  -1,       // currently playing index in queue
  playing:   false,
  favs:      [],       // [{collectionId, collectionName, artworkUrl100, artistName}]
  theme:     'light',
  // Pagination
  searchTerm:   '',    // current search term (empty = category browse)
  searchCat:    '',    // current category (empty = text search)
  searchOffset: 0,     // current offset into results
  searchLimit:  40,    // results per page
  searchHasMore:false, // whether more results are available
};

// ═══════════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const proxyImg = url => url ? PROXY + encodeURIComponent(url) : '';
// Upsize iTunes artwork URL and route through proxy.
// iTunes serves any size — swap the embedded dimensions string.
const artImg = (url, size=400) => {
  if (!url) return '';
  const sized = url.replace(/\d+x\d+bb/, size + 'x' + size + 'bb');
  return proxyImg(sized);
};
const fmtTime = s => {
  if (isNaN(s) || !isFinite(s)) return '0:00';
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = Math.floor(s%60);
  if (h) return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  return `${m}:${String(sec).padStart(2,'0')}`;
};
const fmtDate = ds => {
  if (!ds) return '';
  try { return new Date(ds).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
  catch { return ds.slice(0,10); }
};
const strip = html => {
  const d = document.createElement('div');
  d.innerHTML = html || '';
  return d.textContent.trim();
};
const toast = (msg, dur=2500) => {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  $('toastWrap').appendChild(el);
  setTimeout(() => el.style.opacity='0', dur-300);
  setTimeout(() => el.remove(), dur);
};

async function fetchJSON(url) {
  const proxied = PROXY + encodeURIComponent(url);
  const r = await fetch(proxied);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

// ═══════════════════════════════════════════════════════════════
// PERSISTENCE
// ═══════════════════════════════════════════════════════════════
function loadFavs() {
  try { S.favs = JSON.parse(localStorage.getItem(LS_FAV)) || []; } catch { S.favs = []; }
}
function saveFavs() {
  localStorage.setItem(LS_FAV, JSON.stringify(S.favs));
}
function isFav(id) { return S.favs.some(f => f.collectionId === id); }

function toggleFav(podcast, e) {
  if (e) e.stopPropagation();
  if (isFav(podcast.collectionId)) {
    S.favs = S.favs.filter(f => f.collectionId !== podcast.collectionId);
    toast('Removed from favourites');
  } else {
    S.favs.push({
      collectionId:   podcast.collectionId,
      collectionName: podcast.collectionName,
      artworkUrl100:  podcast.artworkUrl100,
      artistName:     podcast.artistName,
    });
    toast('★ Added to favourites');
  }
  saveFavs();
  renderFavs();
  // Update any visible star buttons
  document.querySelectorAll('[data-fav-id]').forEach(btn => {
    if (+btn.dataset.favId === podcast.collectionId) {
      btn.classList.toggle('is-fav', isFav(podcast.collectionId));
      btn.title = isFav(podcast.collectionId) ? 'Remove favourite' : 'Add favourite';
      btn.textContent = isFav(podcast.collectionId) ? '★' : '☆';
    }
  });
}

function downloadFavs() {
  const blob = new Blob([JSON.stringify(S.favs, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'wavefinder-favourites.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

// ═══════════════════════════════════════════════════════════════
// QUEUE / AUDIO
// ═══════════════════════════════════════════════════════════════
const audio = $('audioEl');

function saveQueue() {
  try {
    localStorage.setItem(LS_Q,   JSON.stringify(S.queue));
    localStorage.setItem(LS_NOW, String(S.queueIdx));
    localStorage.setItem(LS_POS, String(audio.currentTime || 0));
  } catch {}
}
function loadQueue() {
  try {
    S.queue    = JSON.parse(localStorage.getItem(LS_Q))    || [];
    S.queueIdx = parseInt(localStorage.getItem(LS_NOW));
    if (isNaN(S.queueIdx)) S.queueIdx = -1;
    const pos  = parseFloat(localStorage.getItem(LS_POS))  || 0;

    if (!S.queue.length || S.queueIdx < 0 || S.queueIdx >= S.queue.length) return;

    const item = S.queue[S.queueIdx];
    const src  = item.ep.episodeUrl || item.ep.trackViewUrl || '';
    if (!src) return;

    audio.src = PROXY + encodeURIComponent(src);
    audio.load();
    updatePlayerUI(item);
    updateQueueUI();

    // Seek to saved position once enough metadata is loaded.
    // 'loadedmetadata' fires when duration is known — safe to set currentTime.
    // We need a one-time listener so it doesn't re-seek on subsequent loads.
    const seekOnce = () => {
      if (pos > 0 && isFinite(pos)) {
        audio.currentTime = pos;
        // Show resume toast with timestamp so user knows where they left off
        const label = strip(item.ep.trackName) || 'episode';
        toast('\u23f8 Paused at ' + fmtTime(pos) + ' — press \u25b6 to resume');
      }
    };
    audio.addEventListener('loadedmetadata', seekOnce, {once: true});
    // Fallback: some proxied streams don't fire loadedmetadata until play()
    // Use canplay as a second attempt
    audio.addEventListener('canplay', () => {
      if (pos > 0 && Math.abs(audio.currentTime - pos) > 2) {
        audio.currentTime = pos;
      }
    }, {once: true});

  } catch(e) {
    console.warn('loadQueue failed:', e);
    S.queue = []; S.queueIdx = -1;
  }
}

function addToQueue(ep, show, playNow=false) {
  // Check if already in queue
  const exists = S.queue.findIndex(i => i.ep.trackId === ep.trackId);
  if (exists >= 0 && !playNow) { toast('Already in queue'); return; }

  if (playNow) {
    if (exists >= 0) S.queue.splice(exists, 1);
    // Insert after current
    const insertAt = S.queueIdx >= 0 ? S.queueIdx + 1 : 0;
    S.queue.splice(insertAt, 0, {ep, show});
    S.queueIdx = insertAt;
    playQueue(S.queueIdx);
  } else {
    if (exists < 0) S.queue.push({ep, show});
    if (S.queueIdx < 0) {
      S.queueIdx = 0;
      playQueue(0);
    } else {
      toast('Added to queue');
    }
  }
  saveQueue();
  updateQueueUI();
}

function playQueue(idx) {
  if (idx < 0 || idx >= S.queue.length) { stopPlayback(); return; }
  S.queueIdx = idx;
  const item = S.queue[idx];
  const src  = item.ep.episodeUrl || item.ep.trackViewUrl || '';
  if (!src) { toast('No audio link for this episode'); playQueue(idx+1); return; }
  audio.src = PROXY + encodeURIComponent(src);
  audio.load();
  audio.play().catch(() => {});
  updatePlayerUI(item);
  updateEpHighlights();
  saveQueue();
  updateQueueUI();
}

function stopPlayback() {
  audio.pause();
  audio.src = '';
  S.playing = false;
  S.queueIdx = -1;
  $('playIcon').innerHTML = '<path d="M8 5v14l11-7z"/>';
  $('playerTitle').textContent = 'Nothing playing';
  $('playerShow').textContent  = '—';
  $('playerArt').src = '';
}

function updatePlayerUI(item) {
  if (!item) return;
  $('playerTitle').textContent = strip(item.ep.trackName) || 'Untitled Episode';
  $('playerShow').textContent  = item.show?.collectionName || '';
  $('playerArt').src  = artImg(item.show?.artworkUrl100 || item.ep.artworkUrl100 || '', 200);
  $('playerArt').style.display = '';
}

function updateQueueUI() {
  const panel = $('queueList');
  if (!S.queue.length) {
    panel.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text3);font-size:12px">Queue is empty</div>';
    $('queueCount').style.display = 'none';
    $('queueBadge').style.display = 'none';
    return;
  }
  $('queueCount').textContent = (S.queueIdx+1) + '/' + S.queue.length;
  $('queueCount').style.display = '';
  $('queueBadge').style.display = '';
  panel.innerHTML = S.queue.map((item,i) => {
    const title = strip(item.ep.trackName) || 'Untitled';
    const art   = artImg(item.show?.artworkUrl100 || item.ep.artworkUrl100 || '', 100);
    const isNow = i === S.queueIdx;
    return `<div class="queue-ep ${isNow?'now':''}" data-qi="${i}" onclick="QP.jumpTo(${i})">
      <img class="queue-ep-art" src="${esc(art)}" alt="">
      <div class="queue-ep-info">
        <div class="queue-ep-title">${esc(title)}</div>
        <div class="queue-ep-show">${esc(item.show?.collectionName||'')}</div>
      </div>
      <button class="queue-ep-remove" onclick="event.stopPropagation();QP.remove(${i})">✕</button>
    </div>`;
  }).join('');
}

function updateEpHighlights() {
  document.querySelectorAll('.ep-item').forEach(el => {
    const tid = +el.dataset.tid;
    const item = S.queue[S.queueIdx];
    const isPlaying = item && item.ep.trackId === tid;
    el.classList.toggle('playing', isPlaying);
    // Queued (in queue but not currently playing)
    const qi = S.queue.findIndex((i,idx)=>i.ep.trackId===tid && idx!==S.queueIdx);
    el.classList.toggle('queued', qi>=0 && !isPlaying);
    const ind = el.querySelector('.ep-play-indicator');
    if (ind) ind.textContent = isPlaying ? '⏸' : qi>=0 ? `${qi+1}` : '▶';
  });
}

// Queue Panel API
const QP = {
  jumpTo(i) { S.queueIdx = i; playQueue(i); },
  remove(i)  {
    if (i === S.queueIdx) {
      S.queue.splice(i,1);
      if (S.queue.length) playQueue(Math.min(i, S.queue.length-1));
      else stopPlayback();
    } else {
      S.queue.splice(i,1);
      if (i < S.queueIdx) S.queueIdx--;
    }
    saveQueue();
    updateQueueUI();
    updateEpHighlights();
  },
  clear() {
    S.queue = []; S.queueIdx = -1;
    stopPlayback(); saveQueue(); updateQueueUI(); updateEpHighlights();
  },
};

// ═══════════════════════════════════════════════════════════════
// AUDIO EVENTS
// ═══════════════════════════════════════════════════════════════
audio.addEventListener('play',  () => {
  S.playing = true;
  $('playIcon').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
});
audio.addEventListener('pause', () => {
  S.playing = false;
  $('playIcon').innerHTML = '<path d="M8 5v14l11-7z"/>';
});
audio.addEventListener('ended', () => {
  // Auto-advance queue
  if (S.queueIdx < S.queue.length - 1) playQueue(S.queueIdx + 1);
  else stopPlayback();
});
audio.addEventListener('timeupdate', () => {
  const cur  = audio.currentTime;
  const dur  = audio.duration || 0;
  $('timeEl').textContent  = fmtTime(cur);
  $('durEl').textContent   = fmtTime(dur);
  $('progressFill').style.width = dur ? (cur/dur*100)+'%' : '0%';
  // Save position every 5s
  if (Math.floor(cur) % 5 === 0) saveQueue();
});
audio.addEventListener('error', () => {
  toast('Audio error — trying next');
  if (S.queueIdx < S.queue.length - 1) playQueue(S.queueIdx + 1);
});

$('progressTrack').addEventListener('click', e => {
  const dur = audio.duration;
  if (!dur) return;
  const pct = e.offsetX / e.currentTarget.offsetWidth;
  audio.currentTime = pct * dur;
});
$('volSlider').addEventListener('input', e => { audio.volume = e.target.value; });
$('btnPlayPause').addEventListener('click', () => {
  if (audio.paused) audio.play().catch(()=>{});
  else audio.pause();
});
$('btnBack30').addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime-30); });
$('btnFwd30' ).addEventListener('click', () => { audio.currentTime = Math.min(audio.duration||Infinity, audio.currentTime+30); });
$('btnPrev'  ).addEventListener('click', () => { if (S.queueIdx > 0) playQueue(S.queueIdx-1); });
$('btnNext'  ).addEventListener('click', () => { if (S.queueIdx < S.queue.length-1) playQueue(S.queueIdx+1); });

// ═══════════════════════════════════════════════════════════════
// SEARCH & BROWSE
// ═══════════════════════════════════════════════════════════════
async function searchPodcasts(term, append=false) {
  if (!append) {
    S.searchTerm   = term;
    S.searchCat    = '';
    S.searchOffset = 0;
    S.searchHasMore= false;
    showLoading();
  } else {
    setLoadMoreLoading(true);
  }
  try {
    const url = `${ITUNES}/search?media=podcast&limit=${S.searchLimit}`
      + `&offset=${S.searchOffset}&term=${encodeURIComponent(term)}`;
    const data   = await fetchJSON(url);
    const results = data.results || [];
    if (append) {
      // Deduplicate by collectionId before appending
      const existing = new Set(S.podcasts.map(p => p.collectionId));
      const fresh = results.filter(p => !existing.has(p.collectionId));
      S.podcasts = [...S.podcasts, ...fresh];
    } else {
      S.podcasts = results;
    }
    S.searchOffset  += results.length;
    // iTunes returns fewer than limit when exhausted
    S.searchHasMore  = results.length >= S.searchLimit;
    if (append) {
      appendPodcastCards(results, S.podcasts.length - results.length);
      updateLoadMore();
    } else {
      renderPodcastGrid(S.podcasts, `Results for "${term}"`);
    }
  } catch(e) {
    if (append) { setLoadMoreLoading(false); toast('Load failed: ' + e.message); }
    else showError('Search failed: ' + e.message);
  }
}

async function browseCategory(cat, append=false) {
  if (!append) {
    S.searchCat    = cat;
    S.searchTerm   = '';
    S.searchOffset = 0;
    S.searchHasMore= false;
    showLoading();
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat===cat));
  } else {
    setLoadMoreLoading(true);
  }
  try {
    const url = `${ITUNES}/search?media=podcast&limit=${S.searchLimit}`
      + `&offset=${S.searchOffset}&term=${encodeURIComponent(cat)}`;
    const data    = await fetchJSON(url);
    const results = data.results || [];
    if (append) {
      const existing = new Set(S.podcasts.map(p => p.collectionId));
      const fresh = results.filter(p => !existing.has(p.collectionId));
      S.podcasts = [...S.podcasts, ...fresh];
    } else {
      S.podcasts = results;
    }
    S.searchOffset  += results.length;
    S.searchHasMore  = results.length >= S.searchLimit;
    const label = CATEGORIES.find(c=>c.id===cat)?.label || cat;
    if (append) {
      appendPodcastCards(results, S.podcasts.length - results.length);
      updateLoadMore();
    } else {
      renderPodcastGrid(S.podcasts, label);
    }
  } catch(e) {
    if (append) { setLoadMoreLoading(false); toast('Load failed: ' + e.message); }
    else showError('Browse failed: ' + e.message);
  }
}

async function loadEpisodes(podcast) {
  S.selected = podcast;
  showLoading();
  try {
    const url  = `${ITUNES}/lookup?id=${podcast.collectionId}&media=podcast&entity=podcastEpisode&limit=${MAX_EPS}`;
    const data = await fetchJSON(url);
    // First result is the show itself; rest are episodes
    S.episodes = (data.results || []).filter(r => r.kind === 'podcast-episode');
    renderEpisodeList(podcast, S.episodes);
  } catch(e) {
    showError('Could not load episodes: ' + e.message);
  }
}

// ═══════════════════════════════════════════════════════════════
// RENDER HELPERS
// ═══════════════════════════════════════════════════════════════
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showLoading() {
  $('mainInner').innerHTML = '<div class="loading fade-in"><div class="spinner"></div><span style="font-size:12px;color:var(--text3)">Loading…</span></div>';
}
function showError(msg) {
  $('mainInner').innerHTML = `<div class="error-msg fade-in">⚠ ${esc(msg)}</div>`;
}

function renderPodcastGrid(podcasts, title='') {
  S.view = 'home';
  if (!podcasts.length) {
    $('mainInner').innerHTML = `
      <div class="results-header fade-in"><div class="results-title">${esc(title)}</div></div>
      <div class="empty fade-in">
        <div class="empty-icon">🔍</div>
        <div class="empty-text">No results found</div>
        <div class="empty-sub">Try a different search term or category</div>
      </div>`;
    return;
  }
  // Store podcasts globally so onclick can reference by index (avoids JSON-in-attribute issues)
  window.PODCASTS = podcasts;
  const cards = podcasts.map((p,i) => {
    const fav = isFav(p.collectionId);
    const art = artImg(p.artworkUrl100 || p.artworkUrl60 || '', 400);
    return `<div class="podcast-card card-enter" style="animation-delay:${i*.03}s"
        onclick="onPodcastClick(${i})" data-id="${p.collectionId}">
      <img class="pc-art" src="${esc(art)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
      <div class="pc-body">
        <div class="pc-name">${esc(p.collectionName||'')}</div>
        <div class="pc-artist">${esc(p.artistName||'')}</div>
      </div>
      <button class="pc-fav ${fav?'is-fav':''}" data-fav-id="${p.collectionId}"
        onclick="event.stopPropagation();toggleFav(PODCASTS[${i}],event)"
        title="${fav?'Remove favourite':'Add favourite'}">${fav?'★':'☆'}</button>
    </div>`;
  }).join('');
  $('mainInner').innerHTML = `
    <div class="results-header fade-in">
      <div class="results-title">${esc(title)}</div>
      <div class="results-count" id="resultsCount">${podcasts.length} shows</div>
    </div>
    <div class="podcast-grid" id="podcastGrid">${cards}</div>`;
  window.PODCASTS = podcasts;
  // Inject load-more after the grid if more results are available
  updateLoadMore();
}

// ─── Load More helpers ───────────────────────────────────────

// Append fresh cards to the existing grid without re-rendering everything
function appendPodcastCards(newPodcasts, startIndex) {
  const grid = $('podcastGrid');
  if (!grid) return;
  // Remove existing load-more wrap before appending
  const oldWrap = $('loadMoreWrap');
  if (oldWrap) oldWrap.remove();
  newPodcasts.forEach((p, i) => {
    const idx = startIndex + i;
    const fav = isFav(p.collectionId);
    const art = artImg(p.artworkUrl100 || p.artworkUrl60 || '', 400);
    const div = document.createElement('div');
    div.className = 'podcast-card card-enter';
    div.style.animationDelay = (i * .04) + 's';
    div.dataset.id = p.collectionId;
    div.onclick = () => onPodcastClick(idx);
    div.innerHTML = `
      <img class="pc-art" src="${esc(art)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
      <div class="pc-body">
        <div class="pc-name">${esc(p.collectionName||'')}</div>
        <div class="pc-artist">${esc(p.artistName||'')}</div>
      </div>
      <button class="pc-fav ${fav?'is-fav':''}" data-fav-id="${p.collectionId}"
        title="${fav?'Remove favourite':'Add favourite'}">${fav?'★':'☆'}</button>`;
    // Wire the fav button
    div.querySelector('.pc-fav').addEventListener('click', e => {
      e.stopPropagation();
      toggleFav(window.PODCASTS[idx], e);
    });
    grid.appendChild(div);
  });
  // Update count
  const countEl = $('resultsCount');
  if (countEl) countEl.textContent = window.PODCASTS.length + ' shows';
}

function updateLoadMore() {
  // Remove any existing load-more
  const old = $('loadMoreWrap');
  if (old) old.remove();
  if (!S.searchHasMore) return;
  const grid = $('podcastGrid');
  if (!grid) return;
  const wrap = document.createElement('div');
  wrap.className = 'load-more-wrap';
  wrap.id = 'loadMoreWrap';
  wrap.innerHTML = `<button class="btn-load-more" onclick="loadMore()">
    <div class="spinner"></div>
    <span class="lm-text">Load more shows</span>
  </button>`;
  grid.after(wrap);
}

function setLoadMoreLoading(on) {
  const btn = $('loadMoreWrap')?.querySelector('.btn-load-more');
  if (!btn) return;
  btn.disabled = on;
  btn.classList.toggle('loading', on);
}

// Triggered by Load More button — continues current search or category
window.loadMore = () => {
  if (S.searchTerm)  searchPodcasts(S.searchTerm, true);
  else if (S.searchCat) browseCategory(S.searchCat, true);
};

// Podcast click handler — uses index into PODCASTS array
window.onPodcastClick = async (i) => {
  const podcast = window.PODCASTS && window.PODCASTS[i];
  if (!podcast) return;
  await loadEpisodes(podcast);
};

function renderEpisodeList(podcast, episodes) {
  S.view = 'episodes';
  const fav = isFav(podcast.collectionId);
  const rows = episodes.map((ep,i) => {
    const title   = strip(ep.trackName) || 'Untitled Episode';
    const desc    = strip(ep.description || ep.shortDescription || '');
    const hasAudio= !!(ep.episodeUrl || ep.trackViewUrl);
    const item    = S.queue[S.queueIdx];
    const isPlay  = item && item.ep.trackId === ep.trackId;
    const qi      = S.queue.findIndex((it,idx)=>it.ep.trackId===ep.trackId && idx!==S.queueIdx);
    const isQ     = qi >= 0 && !isPlay;
    return `<div class="ep-item fade-in ${isPlay?'playing':''} ${isQ?'queued':''}"
        style="animation-delay:${i*.015}s" data-tid="${ep.trackId}"
        onclick="onEpClick(${i})">
      <div class="ep-num">${i+1}</div>
      <div class="ep-body">
        <div class="ep-title">${esc(title)}</div>
        ${desc ? `<div class="ep-desc">${esc(desc.substring(0,160))}${desc.length>160?'…':''}</div>` : ''}
        <div class="ep-meta">
          ${ep.releaseDate ? `<span class="ep-date">${fmtDate(ep.releaseDate)}</span>` : ''}
          ${ep.trackTimeMillis ? `<span class="ep-dur">${fmtTime(ep.trackTimeMillis/1000)}</span>` : ''}
          ${!hasAudio ? '<span class="ep-dur" style="color:var(--accent)">No audio</span>' : ''}
        </div>
      </div>
      <div style="position:relative">
        <div class="ep-play-indicator">${isPlay?'⏸':isQ?String(qi+1):'▶'}</div>
      </div>
    </div>`;
  }).join('');

  $('mainInner').innerHTML = `
    <div class="ep-list-header fade-in">
      <button class="btn-back" onclick="goBack()">← Back</button>
    </div>
    <div class="show-meta fade-in">
      <img class="show-art" src="${artImg(podcast.artworkUrl100||podcast.artworkUrl60||'', 400)}" alt="" onerror="this.style.visibility='hidden'">
      <div class="show-info">
        <div class="show-name">${esc(podcast.collectionName||'')}</div>
        <div class="show-artist">${esc(podcast.artistName||'')}</div>
        <div class="show-desc">${esc(strip(podcast.feedUrl ? '' : ''))}</div>
        <div class="show-actions">
          <button class="btn-sm ${fav?'is-fav':''}" data-fav-id="${podcast.collectionId}"
            onclick="toggleFav(S.selected,event)">${fav?'★ Saved':'☆ Save'}</button>
          <button class="btn-sm" onclick="downloadFavs()">⬇ Export Favs</button>
        </div>
      </div>
    </div>
    <div class="ep-count fade-in">${episodes.length} episode${episodes.length!==1?'s':''}</div>
    ${rows || '<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">No episodes found</div></div>'}`;

  window.EPISODES = episodes;
  window.onEpClick = (i) => {
    const ep   = EPISODES[i];
    const show = S.selected;
    const currentItem = S.queue[S.queueIdx];

    if (currentItem && currentItem.ep.trackId === ep.trackId) {
      // Clicking the currently playing episode — toggle pause/resume
      audio.paused ? audio.play().catch(()=>{}) : audio.pause();
    } else if (!S.queue.length || S.queueIdx < 0) {
      // Nothing in queue and nothing playing — play immediately, no queue entry
      S.queue    = [{ep, show}];
      S.queueIdx = 0;
      playQueue(0);
      toast('▶ Playing: ' + (strip(ep.trackName)||'').substring(0,40));
    } else {
      // Something already playing — insert after current and advance to it
      // Remove any existing duplicate first
      const dup = S.queue.findIndex(it => it.ep.trackId === ep.trackId);
      if (dup >= 0) S.queue.splice(dup, 1);
      const insertAt = S.queueIdx + 1;
      S.queue.splice(insertAt, 0, {ep, show});
      S.queueIdx = insertAt;
      playQueue(S.queueIdx);
      toast('▶ Playing: ' + (strip(ep.trackName)||'').substring(0,40));
    }
    saveQueue();
    updateQueueUI();
    updateEpHighlights();
  };
}

function goBack() {
  if (S.podcasts.length) {
    renderPodcastGrid(S.podcasts, 'Results');
  } else {
    $('mainInner').innerHTML = '<div class="empty fade-in"><div class="empty-icon">🎙</div><div class="empty-text">Discover Podcasts</div><div class="empty-sub">Search by name or browse a category</div></div>';
  }
}

// ═══════════════════════════════════════════════════════════════
// FAVOURITES SIDEBAR
// ═══════════════════════════════════════════════════════════════
function renderFavs() {
  const el = $('favsList');
  if (!S.favs.length) {
    el.innerHTML = '<div class="empty-favs">No favourites yet.<br>★ a show to save it here.</div>';
    return;
  }
  el.innerHTML = S.favs.map(f => `
    <div class="fav-item" onclick="loadEpisodesByFav(${f.collectionId})">
      <img class="fav-thumb" src="${artImg(f.artworkUrl100||'', 100)}" alt="">
      <span class="fav-name">${esc(f.collectionName||'')}</span>
      <button class="fav-remove" title="Remove" onclick="event.stopPropagation();removeFav(${f.collectionId})">✕</button>
    </div>`).join('');
}

window.loadEpisodesByFav = async (id) => {
  const fav = S.favs.find(f => f.collectionId === id);
  if (!fav) return;
  await loadEpisodes(fav); // loadEpisodes is the internal async function
};
window.removeFav = (id) => {
  S.favs = S.favs.filter(f => f.collectionId !== id);
  saveFavs(); renderFavs(); toast('Removed from favourites');
  document.querySelectorAll(`[data-fav-id="${id}"]`).forEach(btn => {
    btn.classList.remove('is-fav');
    btn.textContent = '☆';
  });
};

// ═══════════════════════════════════════════════════════════════
// CATEGORIES
// ═══════════════════════════════════════════════════════════════
function renderCategories() {
  $('catGrid').innerHTML = CATEGORIES.map(c =>
    `<button class="cat-btn" data-cat="${esc(c.id)}" onclick="browseCategory('${esc(c.id)}')">
      <span class="cat-icon">${c.icon}</span>${esc(c.label)}
    </button>`
  ).join('');
}

// ═══════════════════════════════════════════════════════════════
// THEME
// ═══════════════════════════════════════════════════════════════
function setTheme(t) {
  S.theme = t;
  document.documentElement.dataset.theme = t==='dark'?'dark':'';
  localStorage.setItem(LS_THEME, t);
  // Swap icon
  if (t==='dark') {
    $('themeIcon').innerHTML = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`;
  } else {
    $('themeIcon').innerHTML = `<circle cx="12" cy="12" r="5"/>
      <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42
               M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>`;
  }
}
$('btnTheme').addEventListener('click', () => setTheme(S.theme==='dark'?'light':'dark'));

// ═══════════════════════════════════════════════════════════════
// QUEUE PANEL TOGGLE
// ═══════════════════════════════════════════════════════════════
$('btnQueue'     ).addEventListener('click', () => $('queuePanel').classList.toggle('open'));
$('btnCloseQueue').addEventListener('click', () => $('queuePanel').classList.remove('open'));
$('btnClearQueue').addEventListener('click', () => { QP.clear(); toast('Queue cleared'); });

// ═══════════════════════════════════════════════════════════════
// SEARCH FORM
// ═══════════════════════════════════════════════════════════════
$('searchForm').addEventListener('submit', e => {
  e.preventDefault();
  const q = $('searchInput').value.trim();
  if (q) searchPodcasts(q);
});

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
function init() {
  // Theme
  const savedTheme = localStorage.getItem(LS_THEME) || 'light';
  setTheme(savedTheme);

  // Favs
  loadFavs();
  renderFavs();
  renderCategories();

  // Restore queue & playback position (without interrupting)
  loadQueue();
  updateQueueUI();
}

init();
</script>
</body>
</html>
